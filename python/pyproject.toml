# SPDX-License-Identifier: Apache-2.0
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ajar-connector"
version = "0.1.0"
description = "Python SDK for building byte-compatible connectors to the Ajar integration plane."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Ajar connectors contributors" }]
dependencies = [
    "protobuf>=7.35,<8",
    "cryptography>=42",
]

[project.optional-dependencies]
# Transport for the example connectors — kept OUT of the SDK's core deps.
examples = ["nats-py>=2.6"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ajar_connector*"]

[tool.pytest.ini_options]
# Make ajar_connector importable from the repo without an install step.
pythonpath = ["."]
testpaths = ["tests"]
