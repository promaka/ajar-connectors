# SPDX-License-Identifier: Apache-2.0
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ajar-connector"
version = "0.5.7"
description = "Python SDK for building byte-compatible connectors to the Ajar integration plane."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Ajar connectors contributors" }]
keywords = ["ajar", "connector", "defence", "interoperability", "protobuf", "ed25519"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Networking",
]

dependencies = [
    "protobuf>=7.35,<8",
    "cryptography>=42",
]

[project.urls]
Homepage = "https://github.com/promaka/ajar-connectors"
Documentation = "https://github.com/promaka/ajar-connectors/blob/main/docs/embedding-python.md"
"Wire contract" = "https://github.com/promaka/ajar-connectors/blob/main/docs/wire-contract-v1.md"
Source = "https://github.com/promaka/ajar-connectors"
Changelog = "https://github.com/promaka/ajar-connectors/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Transport for the example connectors — kept OUT of the SDK's core deps.
examples = ["nats-py>=2.6"]
# Transport for the embedded derived-events producer (ajar_connector.producer).
producer = ["nats-py>=2.6"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ajar_connector*"]

[tool.pytest.ini_options]
# Make ajar_connector importable from the repo without an install step.
pythonpath = ["."]
testpaths = ["tests"]
