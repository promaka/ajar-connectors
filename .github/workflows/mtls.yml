# SPDX-License-Identifier: Apache-2.0
# Proves a connector image built from this checkout can reach an mTLS NATS and
# publish an event over it.
#
# The unit tests exercise the TLS policy but never open a socket, so they stay
# green whether or not the shipped binary can complete a handshake. A connector
# that cannot reach a TLS bus is the sovereign posture failing silently, so this
# runs the real image against a real server with a real client certificate and
# asserts an event actually arrives.
name: mtls

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  publishes-over-mtls:
    name: the connector publishes over mTLS
    runs-on: ubuntu-latest
    # A gate that hangs tells you nothing and blocks the queue. Ten minutes is far
    # more than the seconds this needs, so exceeding it is a fault to look at.
    timeout-minutes: 10
    env:
      # Built from this checkout, so the gate proves the code under review rather
      # than the last release. A published image cannot demonstrate a fix that is
      # not in it yet, and pinning one would leave this permanently red on exactly
      # the change that repairs it. The released artefacts are proven separately
      # by the release workflow, which builds and pushes them.
      IMAGE: ajar-connector-generic:under-test
    steps:
      - uses: actions/checkout@v7
      - name: Build the connector image from this checkout
        run: |
          docker build -f deploy/docker/Dockerfile.build \
            --build-arg WSDIR=rust/connectors \
            --build-arg PKG=ajar-generic \
            -t "$IMAGE" .

      - name: Mint P-256 certificates
        run: ./.github/scripts/mtls-certs.sh "$GITHUB_WORKSPACE/certs"

      - name: Start a TLS-verifying NATS
        run: |
          set -euo pipefail
          docker run -d --name nats \
            -v "$GITHUB_WORKSPACE/certs:/certs:ro" \
            -v "$GITHUB_WORKSPACE/.github/scripts/nats-mtls.conf:/nats.conf:ro" \
            -p 4222:4222 nats:2-alpine -c /nats.conf
          for i in $(seq 1 20); do
            docker logs nats 2>&1 | grep -q "Server is ready" && break
            sleep 1
          done
          docker logs nats 2>&1 | tail -5

      - name: Publish one event through the image
        run: |
          set -euo pipefail
          # A file source rather than stdin: the container runs detached, so
          # nothing depends on holding a pipe open and the step cannot block on
          # a process that never exits.
          cat > "$GITHUB_WORKSPACE/c.toml" <<'TOML'
          source_id = "ajar-connector"
          nats_url = "tls://127.0.0.1:4222"
          signing_key_path = "/etc/ajar/seed"
          [transport]
          kind = "file"
          path = "/etc/ajar/feed.jsonl"
          from_start = true
          [mapping]
          format = "json"
          entity_type = "mim:aircraft"
          lat_field = "lat"
          lon_field = "lon"
          TOML
          echo '{"lat":25.27,"lon":51.52}' > "$GITHUB_WORKSPACE/feed.jsonl"
          head -c 32 /dev/urandom > "$GITHUB_WORKSPACE/seed"

          docker run -d --name conn --network host \
            -e AJAR_TLS_CA=/etc/ajar/certs/ca.pem \
            -e AJAR_TLS_CERT=/etc/ajar/certs/client.pem \
            -e AJAR_TLS_KEY=/etc/ajar/certs/client.key \
            -e RUST_LOG=info -e NO_COLOR=1 \
            -v "$GITHUB_WORKSPACE/certs:/etc/ajar/certs:ro" \
            -v "$GITHUB_WORKSPACE/seed:/etc/ajar/seed:ro" \
            -v "$GITHUB_WORKSPACE/feed.jsonl:/etc/ajar/feed.jsonl:ro" \
            -v "$GITHUB_WORKSPACE/c.toml:/etc/ajar/c.toml:ro" \
            "$IMAGE" /etc/ajar/c.toml

          # Poll for the outcome rather than sleeping blind, but bounded.
          strip() { sed -r 's/\x1B\[[0-9;]*[a-zA-Z]//g'; }
          for i in $(seq 1 30); do
            docker logs conn 2>&1 | strip > run.log || true
            grep -qE "published=[1-9]" run.log && break
            sleep 1
          done
          docker rm -f conn >/dev/null 2>&1 || true
          cat run.log

      - name: It must have completed mTLS and published
        run: |
          set -euo pipefail
          grep -q "mTLS enabled" run.log \
            || { echo "::error::the connector did not take the mTLS path"; exit 1; }
          grep -q "connected successfully" run.log \
            || { echo "::error::TLS handshake to NATS did not complete"; docker logs nats | tail -20; exit 1; }
          grep -qE "published=[1-9]" run.log \
            || { echo "::error::connected but published nothing"; exit 1; }
          echo "a published image completed mTLS and published over it"

      - name: NATS must have accepted the client certificate
        run: |
          docker logs nats 2>&1 | tee nats.log
          grep -qiE "TLS handshake error|authentication error" nats.log \
            && { echo "::error::the server rejected the client"; exit 1; } || true
          echo "server accepted the client certificate"
