# SPDX-License-Identifier: Apache-2.0
name: deploy

on:
  push:
    branches: [main]
    paths: ["deploy/**", ".github/workflows/helm.yml"]
  pull_request:
    paths: ["deploy/**", ".github/workflows/helm.yml"]

permissions:
  contents: read

jobs:
  dockerfile:
    name: hadolint the connector Dockerfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: deploy/docker/Dockerfile

  chart:
    name: lint + template the connector chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - name: Lint
        run: |
          helm lint deploy/helm/connector \
            --set image.repository=registry.example/connector \
            --set image.tag=1.0.0 \
            --set signingSeed.existingSecret=connector-seed \
            --set-file connector.config=.github/fixtures/ci-connector.toml
      - name: Template (recommended path)
        run: |
          helm template demo deploy/helm/connector \
            --set image.repository=registry.example/connector \
            --set image.tag=1.0.0 \
            --set connector.sourceId=acme-radar-1 \
            --set signingSeed.existingSecret=connector-seed \
            --set-file connector.config=.github/fixtures/ci-connector.toml > /dev/null
      - name: Guard rails reject incomplete config
        run: |
          if helm template demo deploy/helm/connector --set signingSeed.existingSecret=x >/dev/null 2>&1; then
            echo "expected failure: neither connector.name nor image.repository was accepted"; exit 1
          fi
          # Naming a published connector is enough to resolve the image.
          helm template demo deploy/helm/connector \
            --set connector.name=asterix --set image.tag=1.0.0 \
            --set signingSeed.existingSecret=x \
            --set-file connector.config=.github/fixtures/ci-connector.toml \
            | grep -q "ghcr.io/promaka/ajar-connector-asterix:1.0.0" \
            || { echo "connector.name did not resolve to the published image"; exit 1; }
          if helm template demo deploy/helm/connector --set image.repository=x >/dev/null 2>&1; then
            echo "expected failure: missing signing key was accepted"; exit 1
          fi
          if helm template demo deploy/helm/connector \
               --set image.repository=x --set signingSeed.existingSecret=x >/dev/null 2>&1; then
            echo "expected failure: unpinned image (no tag/digest) was accepted"; exit 1
          fi
          if helm template demo deploy/helm/connector \
               --set image.repository=x --set image.tag=1.0.0 \
               --set signingSeed.existingSecret=x >/dev/null 2>&1; then
            echo "expected failure: missing connector.config was accepted"; exit 1
          fi
          echo "guard rails OK"

  # Renders the chart and starts a REAL published connector against its output.
  # `helm lint` and `helm template` both pass on a chart whose pod cannot start,
  # because neither knows what the binary inside the image expects — so the only
  # way to prove the deploy path is to run it. synthetic-radar is deliberately not
  # used here: it is configured by environment alone and would pass while every
  # connector we actually ship failed.
  chart-runs-a-connector:
    name: the chart's output boots a real connector
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/promaka/ajar-connector-asterix:0.5.2
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Render the chart
        run: |
          set -euo pipefail
          helm template ci deploy/helm/connector \
            --set connector.name=asterix \
            --set image.tag="${IMAGE##*:}" \
            --set signingSeed.existingSecret=ci-seed \
            --set-file connector.config=.github/fixtures/ci-connector.toml \
            > rendered.yaml
      - name: Extract the config and argv the chart chose
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import yaml
          docs = [d for d in yaml.safe_load_all(open("rendered.yaml")) if d]
          cm  = next(d for d in docs if d["kind"] == "ConfigMap")
          dep = next(d for d in docs if d["kind"] == "Deployment")
          args = dep["spec"]["template"]["spec"]["containers"][0].get("args") or []
          assert args, "the chart passed no config path to the connector"
          open("connector.toml", "w").write(next(iter(cm["data"].values())))
          open("argv", "w").write(args[0])
          print("chart argv:", args)
          EOF
      - name: Start the image exactly as the chart would
        run: |
          set -euo pipefail
          ARG="$(cat argv)"
          head -c 32 /dev/urandom > seed
          docker run --rm -d --name conn \
            -v "$GITHUB_WORKSPACE/connector.toml:$ARG:ro" \
            -v "$GITHUB_WORKSPACE/seed:/etc/ajar/seed:ro" \
            "$IMAGE" "$ARG"
          sleep 10
          docker logs conn > logs.txt 2>&1 || true
          docker rm -f conn >/dev/null 2>&1 || true
          cat logs.txt
          # A missing or unreadable config dies before ever logging this line.
          grep -q "connector starting" logs.txt \
            || { echo "::error::the connector never started from the chart's own output"; exit 1; }
          grep -q "ci-asterix" logs.txt \
            || { echo "::error::the connector did not pick up the chart-rendered config"; exit 1; }
          echo "the chart's output boots a real connector"
