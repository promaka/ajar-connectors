# SPDX-License-Identifier: Apache-2.0
name: deploy

on:
  push:
    branches: [main]
    paths: ["deploy/**", ".github/workflows/helm.yml"]
  pull_request:
    paths: ["deploy/**", ".github/workflows/helm.yml"]

permissions:
  contents: read

jobs:
  dockerfile:
    name: hadolint the connector Dockerfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: deploy/docker/Dockerfile

  chart:
    name: lint + template the connector chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint
        run: |
          helm lint deploy/helm/connector \
            --set image.repository=registry.example/connector \
            --set signingSeed.existingSecret=connector-seed
      - name: Template (recommended path)
        run: |
          helm template demo deploy/helm/connector \
            --set image.repository=registry.example/connector \
            --set image.tag=1.0.0 \
            --set connector.sourceId=acme-radar-1 \
            --set signingSeed.existingSecret=connector-seed > /dev/null
      - name: Guard rails reject incomplete config
        run: |
          if helm template demo deploy/helm/connector --set signingSeed.existingSecret=x >/dev/null 2>&1; then
            echo "expected failure: missing image.repository was accepted"; exit 1
          fi
          if helm template demo deploy/helm/connector --set image.repository=x >/dev/null 2>&1; then
            echo "expected failure: missing signing key was accepted"; exit 1
          fi
          if helm template demo deploy/helm/connector \
               --set image.repository=x --set signingSeed.existingSecret=x >/dev/null 2>&1; then
            echo "expected failure: unpinned image (no tag/digest) was accepted"; exit 1
          fi
          echo "guard rails OK"
