# SPDX-License-Identifier: Apache-2.0
# Publish the Rust SDK to crates.io on a release tag, after the golden vectors pass.
# Trusted Publishing (OIDC); crates.io needs a crate's first release published by hand.
name: publish-crates

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    name: the SDK reproduces contract-v1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the toolchain
        run: rustup toolchain install
      - name: Check manifest versions
        run: ./scripts/check-versions.sh "${GITHUB_REF_NAME#v}"
      - name: Run golden vectors
        working-directory: rust
        run: cargo test -p conformance --test golden_vectors
      - name: Package the crate
        working-directory: rust
        run: cargo package -p ajar-connector

  publish:
    name: publish to crates.io
    needs: [conformance]
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Install the toolchain
        run: rustup toolchain install
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish to crates.io
        working-directory: rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p ajar-connector
