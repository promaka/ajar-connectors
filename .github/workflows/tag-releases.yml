# SPDX-License-Identifier: Apache-2.0
# Tag every released package whose version is untagged on main and release it.
# A tag pushed with GITHUB_TOKEN starts no workflow, so release-connector.yml is called.
name: tag-releases

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: tag-releases
  cancel-in-progress: false

jobs:
  tag:
    name: tag bumped packages
    # A manual run from another branch would tag that branch's commit.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.tags.outputs.tags }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: tags
        name: Tag untagged versions
        run: |
          set -euo pipefail
          tags="$(./scripts/release-tags.sh)"
          for t in $tags; do
            # The same guard the release runs, before the tag exists.
            ./scripts/release-target.sh "$t" >/dev/null
          done
          refs=()
          for t in $tags; do
            git tag "$t" "$GITHUB_SHA"
            refs+=("refs/tags/$t")
          done
          # Atomic: a tag pushed without its release is skipped by every later run.
          if [ "${#refs[@]}" -gt 0 ]; then
            git push --atomic origin "${refs[@]}"
            echo "tagged ${refs[*]}"
          fi
          echo "tags=$(jq -Rsc 'split("\n") | map(select(length > 0))' <<<"$tags")" >> "$GITHUB_OUTPUT"

  release:
    name: release ${{ matrix.tag }}
    needs: tag
    if: needs.tag.outputs.tags != '[]'
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJSON(needs.tag.outputs.tags) }}
    uses: ./.github/workflows/release-connector.yml
    with:
      tag: ${{ matrix.tag }}
    secrets: inherit
