# SPDX-License-Identifier: Apache-2.0
# Builds and pushes the REFERENCE connector image with SLSA build provenance +
# SBOM attestations (mirrors Core's image.yml). The image is reference-only —
# vendors build their own connector image from their code.
#
# A vX.Y.Z tag is an SDK release: the C++ tarball, the GitHub release and the
# go/vX.Y.Z module tag (crates.io and PyPI publish from their own workflows).
# The production connector images, their binaries and the chart are released
# per package by release-connector.yml.
name: image

on:
  push:
    branches: [main]
    paths: ["deploy/docker/**", "rust/**", "vendor/**", ".github/workflows/image.yml"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write        # for keyless signing of the attestation
  attestations: write    # for actions/attest-build-provenance

jobs:
  build-push:
    name: build + push + attest (reference image)
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository }}/connector-reference
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.title=ajar connector (reference image)
            org.opencontainers.image.description=REFERENCE / EXAMPLE ONLY — not for production
            ajar.reference-only=true
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
      # Signed, keyless SLSA build-provenance attestation pushed to the registry.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # A vX.Y.Z tag is an SDK release (Rust, Go, Python, C++ at one version);
  # connectors are released on their own tags by release-connector.yml. Checked
  # before anything else publishes, so a tag that cannot produce an honest
  # release fails first.
  guard:
    name: release-guard (SDK)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: tag, SDK manifests, changelog and doc pins agree
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          bash scripts/check-versions.sh "$tag"
          if ! grep -qE "^## \[$tag\]( |$)" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no entry for $tag; write one before tagging"
            exit 1
          fi
          # Install instructions that pin an older release send vendors to an SDK
          # from an earlier ontology, whose events Core rejects or quarantines.
          bash scripts/check-doc-pins.sh "$tag"
          echo "release-guard OK: tag, SDK manifests, changelog and doc pins agree ($tag)"

  # The C++ SDK as one self-contained source tarball. An air-gapped site, or a
  # partner whose build system is CMake and nothing else, takes this file and
  # needs nothing from this repository: the vendored contract travels inside it.
  # Proven by building the extracted tree and running its conformance gate, so a
  # tarball that cannot reproduce contract-v1 never reaches the release.
  cpp-tarball:
    name: package + verify the C++ tarball
    needs: [guard]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ protobuf-compiler libprotobuf-dev
      - name: Package
        run: ./scripts/package-cpp.sh "${GITHUB_REF_NAME#v}" dist
      - name: The extracted tarball builds and is conformant on its own
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          work="$(mktemp -d)"
          tar xzf "dist/ajar-connector-cpp-$ver.tar.gz" -C "$work"
          cd "$work/ajar-connector-cpp-$ver"
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"
          ./build/conformance
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/ajar-connector-cpp-*.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: cpp-tarball
          path: |
            dist/ajar-connector-cpp-*.tar.gz
            dist/ajar-connector-cpp-*.tar.gz.sha256

  # The GitHub release is created here and nowhere else, after every image it
  # refers to has been pushed. A failed build therefore leaves no release rather
  # than one whose images do not exist.
  release:
    name: publish the release
    needs: [build-push, guard, cpp-tarball]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: cpp-tarball
          merge-multiple: true
          path: dist
      - name: SBOM for the release (SPDX)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: dist/ajar-connectors-${{ github.ref_name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: the SBOM exists before anything publishes
        run: test -s "dist/ajar-connectors-${{ github.ref_name }}.spdx.json"
      - name: notes for this version, from CHANGELOG.md
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v v="$ver" '
            $0 == "## [" v "]" || index($0, "## [" v "] ") == 1 { inside = 1; next }
            inside && /^## \[/ { exit }
            inside { print }
          ' CHANGELOG.md > notes.md
          # A missing entry would otherwise publish a release with empty notes.
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no entry for $ver; write one before tagging"
            exit 1
          fi
          cat notes.md
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            --verify-tag \
            dist/*
      # Go resolves a module in a subdirectory through a tag carrying the
      # directory prefix, so every release creates go/vX.Y.Z beside vX.Y.Z;
      # without it, `go get ...@vX.Y.Z` cannot resolve the module. Skipped when
      # the tag exists so a re-run cannot fail on its own tag.
      - name: Tag the Go module
        run: |
          set -euo pipefail
          if git rev-parse "go/${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "go/${GITHUB_REF_NAME} already exists"
          else
            git tag "go/${GITHUB_REF_NAME}" "${GITHUB_SHA}"
            git push origin "go/${GITHUB_REF_NAME}"
          fi
