# SPDX-License-Identifier: Apache-2.0
# Build and push the reference connector image with provenance and SBOM. A vX.Y.Z
# tag also releases the SDK: C++ tarball, GitHub release and go/vX.Y.Z tag.
name: image

on:
  push:
    branches: [main]
    paths: ["deploy/docker/**", "rust/**", "vendor/**", ".github/workflows/image.yml"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write        # for keyless signing of the attestation
  attestations: write    # for actions/attest-build-provenance

jobs:
  build-push:
    name: build + push + attest (reference image)
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository }}/connector-reference
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.title=ajar connector (reference image)
            org.opencontainers.image.description=REFERENCE / EXAMPLE ONLY — not for production
            ajar.reference-only=true
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
      # Signed, keyless SLSA build-provenance attestation pushed to the registry.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # cpp-tarball and release need this job; build-push runs independently.
  guard:
    name: release-guard (SDK)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check tag, manifests and changelog
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          bash scripts/check-versions.sh "$tag"
          if ! grep -qE "^## \[$tag\]( |$)" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no entry for $tag; write one before tagging"
            exit 1
          fi
          bash scripts/check-doc-pins.sh "$tag"
          echo "release-guard OK: tag, SDK manifests, changelog and doc pins agree ($tag)"

  # The extracted tarball is built and run on its own to prove it is self-contained.
  cpp-tarball:
    name: package + verify the C++ tarball
    needs: [guard]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - name: Install the toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ protobuf-compiler libprotobuf-dev
      - name: Package the tarball
        run: ./scripts/package-cpp.sh "${GITHUB_REF_NAME#v}" dist
      - name: Build the extracted tarball
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          work="$(mktemp -d)"
          tar xzf "dist/ajar-connector-cpp-$ver.tar.gz" -C "$work"
          cd "$work/ajar-connector-cpp-$ver"
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"
          ./build/conformance
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/ajar-connector-cpp-*.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: cpp-tarball
          path: |
            dist/ajar-connector-cpp-*.tar.gz
            dist/ajar-connector-cpp-*.tar.gz.sha256

  # The only job that creates the GitHub release, after every image it names is pushed.
  release:
    name: publish the release
    needs: [build-push, guard, cpp-tarball]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: cpp-tarball
          merge-multiple: true
          path: dist
      - name: Generate the SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: dist/ajar-connectors-${{ github.ref_name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Check the SBOM exists
        run: test -s "dist/ajar-connectors-${{ github.ref_name }}.spdx.json"
      - name: Extract release notes
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v v="$ver" '
            $0 == "## [" v "]" || index($0, "## [" v "] ") == 1 { inside = 1; next }
            inside && /^## \[/ { exit }
            inside { print }
          ' CHANGELOG.md > notes.md
          # A missing entry would otherwise publish a release with empty notes.
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no entry for $ver; write one before tagging"
            exit 1
          fi
          cat notes.md
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            --verify-tag \
            dist/*
      # Go resolves a module in go/ through the tag go/vX.Y.Z; skipped if it exists.
      - name: Tag the Go module
        run: |
          set -euo pipefail
          if git rev-parse "go/${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "go/${GITHUB_REF_NAME} already exists"
          else
            git tag "go/${GITHUB_REF_NAME}" "${GITHUB_SHA}"
            git push origin "go/${GITHUB_REF_NAME}"
          fi
