# SPDX-License-Identifier: Apache-2.0
# Builds and pushes the REFERENCE connector image with SLSA build provenance +
# SBOM attestations (mirrors Core's image.yml). The image is reference-only —
# vendors build their own connector image from their code.
name: image

on:
  push:
    branches: [main]
    paths: ["deploy/docker/**", "rust/**", "vendor/**", ".github/workflows/image.yml"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write        # for keyless signing of the attestation
  attestations: write    # for actions/attest-build-provenance

jobs:
  build-push:
    name: build + push + attest (reference image)
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository }}/connector-reference
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.title=ajar connector (reference image)
            org.opencontainers.image.description=REFERENCE / EXAMPLE ONLY — not for production
            ajar.reference-only=true
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
      # Signed, keyless SLSA build-provenance attestation pushed to the registry.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # The PRODUCTION per-connector images a customer actually runs. Built ONLY on a
  # v* tag so a tagged release is the single thing that produces them — with the
  # git revision stamped in, and an SLSA build-provenance attestation so anyone
  # can prove what a given image contains.
  connectors:
    name: build + push + attest (${{ matrix.name }})
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: mavlink, wsdir: rust/connectors, pkg: ajar-mavlink }
          - { name: generic, wsdir: rust/connectors, pkg: ajar-generic }
          - { name: tak-egress, wsdir: rust/connectors, pkg: ajar-tak-egress }
          - { name: adsb, wsdir: rust/connectors, pkg: ajar-adsb }
          - { name: asterix, wsdir: rust/connectors, pkg: ajar-asterix }
          - { name: tak-cot, wsdir: rust/connectors, pkg: ajar-tak-cot }
          - { name: synthetic-radar, wsdir: rust/examples, pkg: synthetic-radar }
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/ajar-connector-${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7
      - name: release-guard — tag must match the connector-suite version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(grep -m1 '^version' rust/connectors/Cargo.toml | cut -d'"' -f2)"
          if [ "$tag" != "$ver" ]; then
            echo "::error::git tag v$tag does not match rust/connectors/Cargo.toml version $ver"
            exit 1
          fi
          # Checked here rather than only in the release job so that a tag which
          # cannot produce release notes fails before any image is published.
          if ! grep -qE "^## \[$tag\]( |$)" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no entry for $tag; write one before tagging"
            exit 1
          fi
          # Install instructions that pin an older release send vendors to an SDK
          # from an earlier ontology, whose events Core discards silently.
          bash scripts/check-doc-pins.sh "$tag"
          echo "release-guard OK: tag, crate version, changelog and doc pins agree ($ver)"
      # No QEMU: Dockerfile.build cross-compiles to arm64 on the native amd64
      # runner, so there is no emulated arch to register.
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=sha
          labels: |
            org.opencontainers.image.title=ajar-connector-${{ matrix.name }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile.build
          platforms: linux/amd64,linux/arm64
          build-args: |
            WSDIR=${{ matrix.wsdir }}
            PKG=${{ matrix.pkg }}
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # The chart is versioned and published with the suite it deploys, so a given
  # release has a chart that matches its images. Chained behind the image builds
  # for the same reason the release is: a chart that references images which do
  # not exist is worse than no chart.
  chart:
    name: package + push the Helm chart
    needs: [connectors]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - name: Package at the release version and push to ghcr
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package deploy/helm/connector --version "$ver" --app-version "$ver" -d dist
          helm push "dist/connector-$ver.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts"

  # Static binaries for the release. An evaluator on a laptop, or an air-gapped
  # site that cannot pull images, otherwise has to build a Rust toolchain first.
  # Same cross-compile path the images use, so these are the binaries in them.
  binaries:
    name: build release binaries (${{ matrix.target }})
    needs: [connectors]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu]
    steps:
      - uses: actions/checkout@v7
      - name: Cross toolchain for aarch64
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross
      - run: rustup target add ${{ matrix.target }}
      - name: Build every connector
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
        run: |
          set -euo pipefail
          cargo build --release --target ${{ matrix.target }} \
            --manifest-path rust/connectors/Cargo.toml --bins
      - name: Collect into one archive
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          out="ajar-connectors-$ver-${{ matrix.target }}"
          mkdir -p "$out"
          find rust/connectors/target/${{ matrix.target }}/release -maxdepth 1 -type f \
            -name 'ajar-*' ! -name '*.d' -exec cp {} "$out/" \;
          ls -la "$out"
          test "$(ls -1 "$out" | wc -l)" -gt 0 || { echo "::error::no binaries collected"; exit 1; }
          tar czf "$out.tar.gz" "$out"
          sha256sum "$out.tar.gz" > "$out.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: |
            ajar-connectors-*.tar.gz
            ajar-connectors-*.tar.gz.sha256

  # The GitHub release is created here and nowhere else, after every image it
  # refers to has been pushed. A failed build therefore leaves no release rather
  # than one whose images do not exist.
  release:
    name: publish the release
    needs: [build-push, connectors, chart, binaries]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          merge-multiple: true
          path: dist
      - name: notes for this version, from CHANGELOG.md
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v v="$ver" '
            $0 == "## [" v "]" || index($0, "## [" v "] ") == 1 { inside = 1; next }
            inside && /^## \[/ { exit }
            inside { print }
          ' CHANGELOG.md > notes.md
          # A missing entry would otherwise publish a release with empty notes.
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no entry for $ver; write one before tagging"
            exit 1
          fi
          cat notes.md
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            --verify-tag \
            dist/*
