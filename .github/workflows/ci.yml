# SPDX-License-Identifier: Apache-2.0
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  guards:
    name: license-headers + contract-divergence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: License headers
        run: ./scripts/check-license-headers.sh
      - name: Contract divergence
        run: ./scripts/check-contract.sh

  rust:
    name: fmt + clippy + test + conformance
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust
            rust/examples
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Conformance gate
        run: cargo test -p conformance --test golden_vectors
      # Examples are a separate workspace (own transport deps).
      - name: Examples — fmt
        working-directory: rust/examples
        run: cargo fmt --all -- --check
      - name: Examples — clippy
        working-directory: rust/examples
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Examples — test
        working-directory: rust/examples
        run: cargo test --workspace
      - name: Examples — synthetic-radar dry-run (no infra)
        working-directory: rust/examples
        run: cargo run -p synthetic-radar -- --dry-run --ticks 2

  go:
    name: gofmt + vet + test + conformance
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: go/go.sum
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "gofmt needed:"; echo "$unformatted"; exit 1; fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Conformance gate
        # -count=1 disables the test cache: it keys on source files, not the
        # external vectors.json, so a re-vendor must never serve a stale pass.
        run: go test ./conformance/ -count=1 -run 'TestGoldenVectorsAreReproduced|TestVerifyingKeyDerivesFromTestSeed' -v
      # Examples are a separate Go module (own transport deps, e.g. nats.go).
      - name: Examples — gofmt
        working-directory: go/examples
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "gofmt needed:"; echo "$unformatted"; exit 1; fi
      - name: Examples — vet + test
        working-directory: go/examples
        run: go vet ./... && go test ./...
      - name: Examples — synthetic-radar dry-run (no infra)
        working-directory: go/examples
        run: go run ./synthetic-radar -dry-run -ticks 2

  cpp:
    name: cmake build + conformance (desktop protoc-C++)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install protobuf + cmake
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential protobuf-compiler libprotobuf-dev libssl-dev
      - name: Install cnats (NATS C client) for the synthetic-radar example
        run: |
          git clone --depth 1 --branch v3.13.0 https://github.com/nats-io/nats.c /tmp/nats.c
          cmake -S /tmp/nats.c -B /tmp/nats.c/build \
            -DNATS_BUILD_STREAMING=OFF -DNATS_BUILD_EXAMPLES=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/nats.c/build -j
          sudo cmake --install /tmp/nats.c/build
          sudo ldconfig
      - name: Configure
        run: cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build cpp/build -j
      - name: Conformance + round-trip gate
        run: ctest --test-dir cpp/build --output-on-failure

  python:
    name: pytest + conformance
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install "protobuf>=7.35,<8" "cryptography>=42" pytest
      - name: Unit tests
        run: python -m pytest -q
      - name: Conformance gate
        run: PYTHONPATH=. python conformance/golden_vectors.py
      - name: synthetic-radar dry-run (no infra)
        run: PYTHONPATH=. python examples/synthetic_radar.py --dry-run --ticks 2
