# SPDX-License-Identifier: Apache-2.0
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  guards:
    name: license-headers + contract-divergence + doc-pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check license headers
        run: ./scripts/check-license-headers.sh
      - name: Check contract hashes
        run: ./scripts/check-contract.sh
      - name: Check documented version pins
        run: ./scripts/check-doc-pins.sh
      - name: Check SDK manifest versions
        run: ./scripts/check-versions.sh
      - name: Resolve every release tag
        run: |
          set -euo pipefail
          for ws in rust/connectors rust/examples; do
            cargo metadata --no-deps --format-version 1 --manifest-path "$ws/Cargo.toml" \
              | jq -r '.packages[] | select(.metadata.ajar.release == true)
                       | "\(.name | ltrimstr("ajar-"))-v\(.version)"'
          done | while read -r tag; do ./scripts/release-target.sh "$tag" >/dev/null; done
          chart=deploy/helm/connector/Chart.yaml
          if grep -qE '^ +ajar\.release: *"?true"?' "$chart"; then
            ./scripts/release-target.sh "chart-v$(grep -m1 '^version:' "$chart" | awk '{print $2}')" >/dev/null
          fi
      - name: Check the catalogue table
        run: ./scripts/check-catalogue.sh

  # Advisory: a change without a version bump is sometimes intended.
  bump-check:
    name: bump-check (advisory)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check version bumps
        run: ./scripts/check-bumps.sh "origin/${{ github.base_ref }}"

  dds-interop:
    name: dds interop (Fast DDS + Cyclone DDS publishers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust/connectors
    env:
      # ros:jazzy-ros-base, pinned by digest.
      ROS_IMAGE: ros@sha256:bab7e640bf79cd84957e4e18fcba7d87efc3385b4e3f36a32eeca01638e43206
    steps:
      - uses: actions/checkout@v7
      - name: Install the toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/connectors
      - name: Build the DDS probe
        run: cargo build -p ajar-connector-common --features dds --example dds_probe
      # Host network for real discovery; ROS 2 ships Fast DDS and adds Cyclone DDS.
      - name: Start ROS 2
        run: |
          set -euo pipefail
          docker run -d --name ros --network host "$ROS_IMAGE" sleep infinity
          docker exec ros bash -lc 'apt-get update -qq >/dev/null && apt-get install -y -qq ros-jazzy-rmw-cyclonedds-cpp >/dev/null'
      - name: Receive from a Fast DDS publisher
        run: |
          set -euo pipefail
          docker exec -d ros bash -lc 'source /opt/ros/jazzy/setup.bash && exec ros2 topic pub -r 5 /chatter std_msgs/msg/String "{data: hello from fastdds}"'
          for i in $(seq 1 30); do
            docker exec ros bash -lc 'source /opt/ros/jazzy/setup.bash && ros2 topic list' | grep -q '^/chatter$' && break
            sleep 2
          done
          out=$(target/debug/examples/dds_probe 0 rt/chatter 'std_msgs::msg::dds_::String_' string 60 1)
          echo "$out"
          grep -q "hello from fastdds" <<<"$out"
          # The bracket keeps the pattern from matching the shell that runs it.
          docker exec ros bash -lc 'pkill -f "[r]os2 topic pub" || true'
      - name: Receive from a Cyclone DDS publisher
        run: |
          set -euo pipefail
          docker exec -d ros bash -lc 'source /opt/ros/jazzy/setup.bash && RMW_IMPLEMENTATION=rmw_cyclonedds_cpp exec ros2 topic pub -r 5 /chatter std_msgs/msg/String "{data: hello from cyclone}"'
          for i in $(seq 1 30); do
            docker exec ros bash -lc 'source /opt/ros/jazzy/setup.bash && RMW_IMPLEMENTATION=rmw_cyclonedds_cpp ros2 topic list' | grep -q '^/chatter$' && break
            sleep 2
          done
          out=$(target/debug/examples/dds_probe 0 rt/chatter 'std_msgs::msg::dds_::String_' string 60 1)
          echo "$out"
          grep -q "hello from cyclone" <<<"$out"
      - name: Dump logs and clean up
        if: always()
        run: |
          docker logs ros 2>&1 | tail -50 || true
          docker rm -f ros >/dev/null 2>&1 || true

  coverage:
    name: line coverage against the floors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the toolchain
        run: rustup toolchain install
      - name: Add coverage tools
        run: rustup component add llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Install nats-server
        run: |
          curl -sSfL https://github.com/nats-io/nats-server/releases/download/v2.10.24/nats-server-v2.10.24-linux-amd64.tar.gz | tar xz
          sudo install nats-server-v2.10.24-linux-amd64/nats-server /usr/local/bin/nats-server
          nats-server --version
      # main.rs is excluded: the gates that run the real binaries cover it.
      - name: Measure SDK coverage
        working-directory: rust
        run: >
          cargo llvm-cov --workspace --all-features
          --ignore-filename-regex '/main\.rs$' --fail-under-lines 90
      - name: Measure connectors coverage
        working-directory: rust/connectors
        run: >
          cargo llvm-cov --workspace --all-features
          --ignore-filename-regex '/main\.rs$' --fail-under-lines 85
      # Examples are templates covered by dry-run gates; this floor only checks they stay tested.
      - name: Measure examples coverage
        working-directory: rust/examples
        run: cargo llvm-cov --workspace --all-features --fail-under-lines 22

  dependencies:
    name: advisories + licences + sources (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: rust/Cargo.toml
          arguments: --config deny.toml
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: rust/connectors/Cargo.toml
          arguments: --config deny.toml
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: rust/examples/Cargo.toml
          arguments: --config deny.toml

  secrets:
    name: no key material beyond the published test vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: a secret in an old commit is still a secret.
          fetch-depth: 0
      - name: Scan history with gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo             ghcr.io/gitleaks/gitleaks:v8.24.3             git --config .gitleaks.toml --no-banner --redact .

  rust:
    name: fmt + clippy + test + conformance
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
      - name: Install the toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust
            rust/connectors
            rust/examples
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --workspace
      - name: Run conformance gate
        run: cargo test -p conformance --test golden_vectors
      - name: Check examples formatting
        working-directory: rust/examples
        run: cargo fmt --all -- --check
      - name: Run clippy on examples
        working-directory: rust/examples
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test examples
        working-directory: rust/examples
        run: cargo test --workspace
      - name: Dry-run synthetic-radar example
        working-directory: rust/examples
        run: cargo run -p synthetic-radar -- --dry-run --ticks 2
      - name: Install nats-server
        run: |
          curl -sSfL https://github.com/nats-io/nats-server/releases/download/v2.10.24/nats-server-v2.10.24-linux-amd64.tar.gz | tar xz
          sudo install nats-server-v2.10.24-linux-amd64/nats-server /usr/local/bin/nats-server
          nats-server --version
      - name: Check connectors formatting
        working-directory: rust/connectors
        run: cargo fmt --all -- --check
      - name: Run clippy on connectors
        working-directory: rust/connectors
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test connectors
        working-directory: rust/connectors
        run: cargo test --workspace
      # Runs one tick of every sensor, so a generator that panics fails here.
      - name: Dry-run synthetic feed
        working-directory: rust/connectors
        run: cargo run -p ajar-feed-synthetic -- --dry-run --ticks 1
      - name: Test SDK consumer feature
        run: cargo test -p ajar-connector --features consumer

  go:
    name: gofmt + vet + test + conformance
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache-dependency-path: go/go.sum
      - name: Check gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "gofmt needed:"; echo "$unformatted"; exit 1; fi
      - name: Run go vet
        run: go vet ./...
      - name: Run tests
        run: go test ./...
      - name: Run conformance gate
        # -count=1: the test cache ignores vectors.json.
        run: go test ./conformance/ -count=1 -run 'TestGoldenVectorsAreReproduced|TestVerifyingKeyDerivesFromTestSeed' -v
      - name: Check examples gofmt
        working-directory: go/examples
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "gofmt needed:"; echo "$unformatted"; exit 1; fi
      - name: Vet and test examples
        working-directory: go/examples
        run: go vet ./... && go test ./...
      - name: Dry-run synthetic-radar example
        working-directory: go/examples
        run: go run ./synthetic-radar -dry-run -ticks 2

  cpp:
    name: cmake build + conformance (desktop protoc-C++)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install protobuf and CMake
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential protobuf-compiler libprotobuf-dev libssl-dev
      - name: Install the NATS C client
        run: |
          git clone --depth 1 --branch v3.13.0 https://github.com/nats-io/nats.c /tmp/nats.c
          cmake -S /tmp/nats.c -B /tmp/nats.c/build \
            -DNATS_BUILD_STREAMING=OFF -DNATS_BUILD_EXAMPLES=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/nats.c/build -j
          sudo cmake --install /tmp/nats.c/build
          sudo ldconfig
      - name: Configure CMake
        run: cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release
      - name: Build with CMake
        run: cmake --build cpp/build -j
      - name: Run conformance tests
        run: ctest --test-dir cpp/build --output-on-failure

  quickstart:
    # Uncached, so the time includes a cold build.
    name: quickstart stopwatch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the toolchain
        run: rustup toolchain install
      - name: Install nats-server
        run: |
          curl -sSfL https://github.com/nats-io/nats-server/releases/download/v2.10.24/nats-server-v2.10.24-linux-amd64.tar.gz | tar xz
          sudo install nats-server-v2.10.24-linux-amd64/nats-server /usr/local/bin/nats-server
          nats-server --version
      - name: Time the quickstart
        run: bash scripts/quickstart-stopwatch.sh

  python:
    name: pytest + conformance
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install "protobuf>=7.35,<8" "cryptography>=42" pytest "nats-py>=2.6"
      - name: Install nats-server
        run: |
          curl -sSfL https://github.com/nats-io/nats-server/releases/download/v2.10.24/nats-server-v2.10.24-linux-amd64.tar.gz | tar xz
          sudo install nats-server-v2.10.24-linux-amd64/nats-server /usr/local/bin/nats-server
          nats-server --version
      - name: Run unit tests
        run: python -m pytest -q
      - name: Run conformance gate
        run: PYTHONPATH=. python conformance/golden_vectors.py
      - name: Dry-run synthetic-radar example
        run: PYTHONPATH=. python examples/synthetic_radar.py --dry-run --ticks 2
