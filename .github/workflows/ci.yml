# SPDX-License-Identifier: Apache-2.0
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  guards:
    name: license-headers + contract-divergence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: License headers
        run: ./scripts/check-license-headers.sh
      - name: Contract divergence
        run: ./scripts/check-contract.sh

  rust:
    name: fmt + clippy + test + conformance
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Conformance gate
        run: cargo test -p conformance --test golden_vectors
