# SPDX-License-Identifier: Apache-2.0
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  guards:
    name: license-headers + contract-divergence + doc-pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: License headers
        run: ./scripts/check-license-headers.sh
      - name: Contract divergence
        run: ./scripts/check-contract.sh
      # Catches a pin going stale on the PR that causes it, rather than at the
      # next release when the docs have already been wrong for weeks.
      - name: Documented version pins
        run: ./scripts/check-doc-pins.sh
      - name: Manifest versions agree
        run: ./scripts/check-versions.sh

  dds-interop:
    name: dds interop (Fast DDS + Cyclone DDS publishers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust/connectors
    env:
      # ros:jazzy-ros-base as of 2026-08-19, pinned by digest like every other
      # external in this workflow; bump deliberately, not by drift.
      ROS_IMAGE: ros@sha256:bab7e640bf79cd84957e4e18fcba7d87efc3385b4e3f36a32eeca01638e43206
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/connectors
      - name: Build the probe (the connector's own transport, nothing else)
        run: cargo build -p ajar-connector-common --features dds --example dds_probe
      # One ROS 2 container on the host network, so discovery is real. ROS 2 is
      # the realistic peer: Fast DDS is its default middleware and Cyclone DDS
      # its alternative, and a std_msgs/String is what an unmanned platform
      # actually publishes. Neither publisher is ours.
      - name: Start ROS 2 and install the second vendor once
        run: |
          set -euo pipefail
          docker run -d --name ros --network host "$ROS_IMAGE" sleep infinity
          docker exec ros bash -lc 'apt-get update -qq >/dev/null && apt-get install -y -qq ros-jazzy-rmw-cyclonedds-cpp >/dev/null'
      - name: Receive from a Fast DDS publisher
        run: |
          set -euo pipefail
          docker exec -d ros bash -lc 'source /opt/ros/jazzy/setup.bash && exec ros2 topic pub -r 5 /chatter std_msgs/msg/String "{data: hello from fastdds}"'
          for i in $(seq 1 30); do
            docker exec ros bash -lc 'source /opt/ros/jazzy/setup.bash && ros2 topic list' | grep -q '^/chatter$' && break
            sleep 2
          done
          out=$(target/debug/examples/dds_probe 0 rt/chatter 'std_msgs::msg::dds_::String_' string 60 1)
          echo "$out"
          grep -q "hello from fastdds" <<<"$out"
          # The bracket keeps the pattern from matching the shell that runs it.
          docker exec ros bash -lc 'pkill -f "[r]os2 topic pub" || true'
      - name: Receive from a Cyclone DDS publisher
        run: |
          set -euo pipefail
          docker exec -d ros bash -lc 'source /opt/ros/jazzy/setup.bash && RMW_IMPLEMENTATION=rmw_cyclonedds_cpp exec ros2 topic pub -r 5 /chatter std_msgs/msg/String "{data: hello from cyclone}"'
          for i in $(seq 1 30); do
            docker exec ros bash -lc 'source /opt/ros/jazzy/setup.bash && RMW_IMPLEMENTATION=rmw_cyclonedds_cpp ros2 topic list' | grep -q '^/chatter$' && break
            sleep 2
          done
          out=$(target/debug/examples/dds_probe 0 rt/chatter 'std_msgs::msg::dds_::String_' string 60 1)
          echo "$out"
          grep -q "hello from cyclone" <<<"$out"
      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs ros 2>&1 | tail -50 || true
          docker rm -f ros >/dev/null 2>&1 || true

  coverage:
    name: line coverage against the floors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Install nats-server (spool gate)
        run: |
          curl -sSfL https://github.com/nats-io/nats-server/releases/download/v2.10.24/nats-server-v2.10.24-linux-amd64.tar.gz | tar xz
          sudo install nats-server-v2.10.24-linux-amd64/nats-server /usr/local/bin/nats-server
          nats-server --version
      # Shipped library and connector code holds an 85% line floor. Binary
      # entrypoints are scoped out of the measurement with the reason on
      # record: main.rs glue is proven by the CI gates that run the real
      # binaries (mTLS, chart deploy, conformance), not by unit tests. The
      # examples are teaching templates, run by dry-run gates rather than
      # tested, and carry a presence floor only.
      # Measured on 2026-08-29: sdk 92%, connectors 86%, examples 26%.
      - name: SDK workspace
        working-directory: rust
        run: >
          cargo llvm-cov --workspace --all-features
          --ignore-filename-regex '/main\.rs$' --fail-under-lines 90
      - name: Connectors workspace
        working-directory: rust/connectors
        run: >
          cargo llvm-cov --workspace --all-features
          --ignore-filename-regex '/main\.rs$' --fail-under-lines 85
      - name: Examples workspace
        working-directory: rust/examples
        run: cargo llvm-cov --workspace --all-features --fail-under-lines 22

  dependencies:
    name: advisories + licences + sources (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: rust/Cargo.toml
          arguments: --config deny.toml
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: rust/connectors/Cargo.toml
          arguments: --config deny.toml
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: rust/examples/Cargo.toml
          arguments: --config deny.toml

  secrets:
    name: no key material beyond the published test vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: a secret in an old commit is still a secret.
          fetch-depth: 0
      - name: gitleaks over the full history
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo             ghcr.io/gitleaks/gitleaks:v8.24.3             git --config .gitleaks.toml --no-banner --redact .

  rust:
    name: fmt + clippy + test + conformance
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust
            rust/connectors
            rust/examples
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Conformance gate
        run: cargo test -p conformance --test golden_vectors
      # Examples are a separate workspace (own transport deps).
      - name: Examples — fmt
        working-directory: rust/examples
        run: cargo fmt --all -- --check
      - name: Examples — clippy
        working-directory: rust/examples
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Examples — test
        working-directory: rust/examples
        run: cargo test --workspace
      - name: Examples — synthetic-radar dry-run (no infra)
        working-directory: rust/examples
        run: cargo run -p synthetic-radar -- --dry-run --ticks 2
      # Connectors are a separate workspace (transport-heavy deps) AND the shipped
      # artifact — build, lint, and test them on every change so a break here can
      # never reach a release image.
      - name: Install nats-server (spool gate)
        run: |
          curl -sSfL https://github.com/nats-io/nats-server/releases/download/v2.10.24/nats-server-v2.10.24-linux-amd64.tar.gz | tar xz
          sudo install nats-server-v2.10.24-linux-amd64/nats-server /usr/local/bin/nats-server
          nats-server --version
      - name: Connectors — fmt
        working-directory: rust/connectors
        run: cargo fmt --all -- --check
      - name: Connectors — clippy
        working-directory: rust/connectors
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Connectors — test
        working-directory: rust/connectors
        run: cargo test --workspace
      - name: SDK — consumer feature (wire gate)
        run: cargo test -p ajar-connector --features consumer

  go:
    name: gofmt + vet + test + conformance
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache-dependency-path: go/go.sum
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "gofmt needed:"; echo "$unformatted"; exit 1; fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Conformance gate
        # -count=1 disables the test cache: it keys on source files, not the
        # external vectors.json, so a re-vendor must never serve a stale pass.
        run: go test ./conformance/ -count=1 -run 'TestGoldenVectorsAreReproduced|TestVerifyingKeyDerivesFromTestSeed' -v
      # Examples are a separate Go module (own transport deps, e.g. nats.go).
      - name: Examples — gofmt
        working-directory: go/examples
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "gofmt needed:"; echo "$unformatted"; exit 1; fi
      - name: Examples — vet + test
        working-directory: go/examples
        run: go vet ./... && go test ./...
      - name: Examples — synthetic-radar dry-run (no infra)
        working-directory: go/examples
        run: go run ./synthetic-radar -dry-run -ticks 2

  cpp:
    name: cmake build + conformance (desktop protoc-C++)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install protobuf + cmake
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential protobuf-compiler libprotobuf-dev libssl-dev
      - name: Install cnats (NATS C client) for the synthetic-radar example
        run: |
          git clone --depth 1 --branch v3.13.0 https://github.com/nats-io/nats.c /tmp/nats.c
          cmake -S /tmp/nats.c -B /tmp/nats.c/build \
            -DNATS_BUILD_STREAMING=OFF -DNATS_BUILD_EXAMPLES=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/nats.c/build -j
          sudo cmake --install /tmp/nats.c/build
          sudo ldconfig
      - name: Configure
        run: cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build cpp/build -j
      - name: Conformance + round-trip gate
        run: ctest --test-dir cpp/build --output-on-failure

  quickstart:
    # The stopwatch: a stranger, this checkout, and the README's prebuilt path,
    # measured from nothing to the first governed event. Deliberately uncached:
    # the number is only honest if the build is as cold as the stranger's.
    name: quickstart stopwatch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install nats-server (spool gate)
        run: |
          curl -sSfL https://github.com/nats-io/nats-server/releases/download/v2.10.24/nats-server-v2.10.24-linux-amd64.tar.gz | tar xz
          sudo install nats-server-v2.10.24-linux-amd64/nats-server /usr/local/bin/nats-server
          nats-server --version
      - name: Follow the README, timed
        run: bash scripts/quickstart-stopwatch.sh

  python:
    name: pytest + conformance
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install "protobuf>=7.35,<8" "cryptography>=42" pytest "nats-py>=2.6"
      - name: Install nats-server (producer wire gate)
        run: |
          curl -sSfL https://github.com/nats-io/nats-server/releases/download/v2.10.24/nats-server-v2.10.24-linux-amd64.tar.gz | tar xz
          sudo install nats-server-v2.10.24-linux-amd64/nats-server /usr/local/bin/nats-server
          nats-server --version
      - name: Unit tests
        run: python -m pytest -q
      - name: Conformance gate
        run: PYTHONPATH=. python conformance/golden_vectors.py
      - name: synthetic-radar dry-run (no infra)
        run: PYTHONPATH=. python examples/synthetic_radar.py --dry-run --ticks 2
