# SPDX-License-Identifier: Apache-2.0
# Publish the Python SDK to PyPI on a release tag, after the golden vectors pass.
# Trusted Publishing (OIDC); no API token is stored.
name: publish-python

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    name: the SDK reproduces contract-v1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check manifest versions
        run: ./scripts/check-versions.sh "${GITHUB_REF_NAME#v}"
      - name: Install the SDK
        run: pip install -e ./python
      - name: Install the toolchain
        run: rustup toolchain install
      - name: Run the conformance harness
        run: |
          set -euo pipefail
          cargo build --release --manifest-path rust/Cargo.toml \
            -p conformance --bin ajar-conformance
          cd python
          PYTHONPATH=. ../rust/target/release/ajar-conformance \
            run --impl python3 examples/conformance_adapter.py \
            --report ../python-conformance.json
      - uses: actions/upload-artifact@v7
        with:
          name: python-conformance
          path: python-conformance.json

  publish:
    name: build + attest + publish to PyPI
    needs: [conformance]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # OIDC for Trusted Publishing and attestations
      attestations: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install build
        run: pip install build
      - name: Build the package
        run: python -m build --outdir dist ./python
      - name: Check the built version
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          ls "dist/ajar_connector-$ver.tar.gz" "dist/ajar_connector-$ver-py3-none-any.whl"
      # Signed, keyless SLSA provenance over the artefacts.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: "dist/*"
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
