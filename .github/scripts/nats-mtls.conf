# Mirrors a sovereign external-ingress bus: TLS required, client certificate
# verified and mapped to a user. A connector that cannot present a valid client
# certificate does not get to publish.
port: 4222
tls {
  cert_file: "/certs/server.pem"
  key_file:  "/certs/server.key"
  ca_file:   "/certs/ca.pem"
  verify_and_map: true
  timeout: 5
}
authorization {
  users = [ { user: "CN=ajar-connector", permissions: { publish: ">", subscribe: ">" } } ]
}
