# SPDX-License-Identifier: Apache-2.0
# cargo-deny policy: advisories, licences, duplicate versions and sources.

[graph]
all-features = true

[advisories]
# A RUSTSEC advisory against the lockfiles fails the build; each exception carries a reason and
# should be time-boxed, not permanent.
version = 2
yanked = "deny"
ignore = [
  # rustls-pemfile is unmaintained, not vulnerable; it arrives only through rumqttc's
  # optional mqtt feature, parsing config the operator wrote. Drop when rumqttc releases without it.
  { id = "RUSTSEC-2025-0134", reason = "transitive via rumqttc (optional mqtt) only; direct use migrated" },
  # rustls-webpki 0.102.x advisories, fixed in 0.103; rumqttc pins ^0.102.8. mqtt is off in
  # every shipped image and binary, so only a --features mqtt build over TLS is exposed.
  # Drop all five when rumqttc moves to 0.103.
  { id = "RUSTSEC-2026-0049", reason = "optional mqtt feature only; rumqttc pins 0.102; not in shipped artefacts" },
  { id = "RUSTSEC-2026-0098", reason = "optional mqtt feature only; rumqttc pins 0.102; not in shipped artefacts" },
  { id = "RUSTSEC-2026-0099", reason = "optional mqtt feature only; rumqttc pins 0.102; not in shipped artefacts" },
  { id = "RUSTSEC-2026-0104", reason = "optional mqtt feature only; rumqttc pins 0.102; not in shipped artefacts" },
  { id = "RUSTSEC-2026-0382", reason = "optional mqtt feature only; rumqttc pins 0.102; not in shipped artefacts; the 0.103 line every shipped binary uses is at the fixed version" },
  # rustdds pulls net2 (via mio 0.6) and paste (via netdev) into shipped binaries through dds.
  # Both are unmaintained, not vulnerable: net2 sets socket options, paste is compile-time.
  # Drop net2 when rustdds leaves mio 0.6 (its mio_08 feature exists today), paste when netdev drops it.
  { id = "RUSTSEC-2020-0016", reason = "net2 via rustdds's mio 0.6; unmaintained, not vulnerable; drop when rustdds moves to mio 0.8" },
  { id = "RUSTSEC-2024-0436", reason = "paste via rustdds's netdev; compile-time macro crate; unmaintained, not vulnerable" },
]

[licenses]
# Everything pulled in must be compatible with Apache-2.0; a transitive copyleft licence fails.
version = 2
allow = [
  "Apache-2.0",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "BSL-1.0",
  "OpenSSL",
  # File-level copyleft; serialport (optional serial transport) is used unmodified.
  "MPL-2.0",
  # The Mozilla root-store data licence, via the WebSocket transport's TLS
  # defaults. Permissive, data-only.
  "CDLA-Permissive-2.0",
]
# One allow-list serves three workspaces; a licence legitimately absent from
# one of them is not a finding.
unused-allowed-license = "allow"

[[licenses.clarify]]
# ring's licence is in a nonstandard file; clarification from cargo-deny's documentation.
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
# Transitive graphs drift; Dependabot consolidates duplicates.
multiple-versions = "warn"

[sources]
# crates.io only.
unknown-registry = "deny"
unknown-git = "deny"
