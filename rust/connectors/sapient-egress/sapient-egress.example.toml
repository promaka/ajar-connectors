# SPDX-License-Identifier: Apache-2.0
#
# SAPIENT (BSI Flex 335) egress: Ajar as a sensor node on a fusion node. `ajar-connectors join`
# writes the first four keys from the invite and --target, and [sapient] from the instance's
# settings.toml. Run by hand: ajar-sapient-egress ./sapient-egress.toml

# Production is tls://<host>:443 with AJAR_TLS_* set to the subscribe-only certificate.
nats_url = "nats://127.0.0.1:4222"

# The signed egress channel; narrow it with ajar.egress.signed.<source_id>.
egress_subject = "ajar.egress.signed.>"

# A file holding Core's egress verifying key as 64 hex characters: the invite's egress.pub.
egress_verifying_key = "/etc/ajar/egress.pub"

# The fusion node's SAPIENT endpoint.
target = "fusion-node.example:7777"

[sapient]
# This node's UUID; set it so a restart re-registers as the same node.
# node_id = "7d2e0b1c-1111-4222-8333-444455556666"
name = "Ajar"
short_name = "AJAR"
# Seconds between status reports; declared at registration.
status_interval_s = 5.0
# Reports held while the fusion node is unreachable; beyond it the oldest is dropped.
buffer_max = 1000
# Classification for an entity type nothing else names.
default_classification = "Unknown"

# This node's position in each status report.
# [sapient.location]
# lat = 51.4700
# lon = -0.4543
# alt_m = 25

# Classification per entity type, over the built-in table; an event's own
# sapient_classification or object_class attribute wins.
# [sapient.classification]
# "x:acme:drone" = "UAV"
