# SPDX-License-Identifier: Apache-2.0
[package]
name = "ajar-sapient-egress"
description = "Ajar egress connector for SAPIENT (BSI Flex 335): Ajar as a sensor node on a fusion node, carrying governed events as detection reports."
version = "0.6.6"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "ajar-sapient-egress"
path = "src/main.rs"

[dependencies]
ajar-connector.workspace = true
ajar-connector-common.workspace = true
ajar-generic-egress = { path = "../generic-egress" }
ajar-sapient-wire = { path = "../sapient-wire" }
prost.workspace = true
prost-types.workspace = true
async-nats.workspace = true
tokio.workspace = true
futures-util.workspace = true
serde.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
hex.workspace = true
time.workspace = true
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
ed25519-dalek.workspace = true

# See CONTRIBUTING.md, "Releases".
[package.metadata.ajar]
release = true
