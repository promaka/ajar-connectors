#
# TAK egress relay: governed CoT from Ajar's NATS egress to TAK, verbatim.
# Run: ajar-tak-egress ./tak-egress.toml

# tls:// in production, with this relay's subscribe-only identity in AJAR_TLS_*.
nats_url = "tls://nats.ajar.svc:4222"
# * is the per-source token.
egress_subject = "ajar.egress.cot.*"

[tak]
# A TAK Server's streaming input, or udp://239.2.3.1:6969 for ATAK's mesh (no certificates).
url = "tls://takserver.mil:8089"
# CA that signed the TAK Server's certificate.
tls_ca = "/etc/tak/ca.crt"
# This relay's client certificate enrolled with the TAK Server, and its key.
tls_cert = "/etc/tak/client.crt"
tls_key = "/etc/tak/client.key"
# Name to verify on the server certificate; defaults to the host in url.
server_name = "takserver.mil"
# Multicast only: IPv4 address of the interface the TAK clients share.
# interface = "192.168.1.20"
# Events held while TAK is unreachable; the oldest is dropped on overflow.
buffer_max = 1000
