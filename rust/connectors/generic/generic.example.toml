#
# Config-driven ingress: newline JSON mapped to events. Run: ajar-generic ./generic.toml

source_id = "acme-sensor-1"
nats_url = "nats://127.0.0.1:4222"
subject_prefix = "ajar.ingest"
signing_key_path = "/etc/ajar/acme-sensor-1.seed"

# Generic feeds usually carry no hostility; set the one the picture should show.
# default_hostility = "Friend"

# Security marking stamped into every event; all fields optional.
# [marking]
# classification = "restricted"
# releasable_to = ["GBR", "ITA"]
# caveats = ["EXERCISE"]

# JSON in a single DDS string field (ROS 2 std_msgs/String); see the doctor for type_name.
# [transport]
# kind = "dds"
# domain = 0
# topic = "rt/detections"
# type_name = "std_msgs::msg::dds_::String_"
# payload = "string"

[transport]
kind = "tcp-client"
connect = "sensor-gateway.example.mil:9000"
framing = "line"

# Or listen for a source that pushes its feed:
#   kind = "tcp-server"
#   bind = "0.0.0.0:9000"
#   framing = "line"

# Or read files dropped into a directory:
#   kind = "dir"
#   path = "/data/drop"
#   process_existing = false

[mapping]
# "json" (one object per frame) or "csv".
format = "json"
# Governed by the vendored ontology; an x:<vendor>:<type> needs registering first.
entity_type = "mim:object"
# Omit timestamp_field to stamp receipt time.
timestamp_field = "observed_at"
# rfc3339, epoch-millis or epoch-seconds.
timestamp_format = "rfc3339"
# A location is emitted only when both lat and lon are present.
lat_field = "latitude"
lon_field = "longitude"
# Optional, metres.
alt_field = "altitude_m"

# Record field = Ajar attribute key.
[mapping.attributes]
heading = "heading"
speed = "speed"

# Record field = metadata key; native identifiers go here.
[mapping.metadata]
sensor_id = "sensor_id"

# CSV variant, replacing the [mapping] above:
# [mapping]
# format = "csv"
# delimiter = ","
# columns = ["observed_at", "sensor_id", "latitude", "longitude", "heading"]
# entity_type = "mim:object"
# timestamp_field = "observed_at"
# timestamp_format = "epoch-seconds"
# lat_field = "latitude"
# lon_field = "longitude"
# [mapping.metadata]
# sensor_id = "sensor_id"
