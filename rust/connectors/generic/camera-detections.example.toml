# SPDX-License-Identifier: Apache-2.0
#
# EO/IR camera detections as newline JSON, one geolocated object per line.
# Run: ajar-generic ./camera-detections.toml
#
# Expected record:
#   {"ts":"2026-06-10T08:00:00Z","track_id":"cam1-42","class":"person",
#    "confidence":0.92,"lat":51.5019,"lon":-0.1425,"bearing":47.0,
#    "bbox_x":312,"bbox_y":118,"bbox_w":64,"bbox_h":140,"camera_id":"north-gate"}

source_id = "camera-north-gate"
nats_url = "nats://127.0.0.1:4222"
subject_prefix = "ajar.ingest"
signing_key_path = "/etc/ajar/camera-north-gate.seed"

# Detections carry no hostility; set the one the picture should show.
default_hostility = "Unknown"

# Security marking stamped into every event; all fields optional.
# [marking]
# classification = "restricted"
# releasable_to = ["GBR", "ITA"]
# caveats = ["EXERCISE"]

[transport]
# The detector pushes newline JSON; tcp-client or dir also work.
kind = "tcp-server"
bind = "0.0.0.0:9200"
framing = "line"

[mapping]
format = "json"
# Governed by the vendored ontology; an x:<vendor>:<type> needs registering first.
entity_type = "mim:object"
timestamp_field = "ts"
timestamp_format = "rfc3339"
# The detector geolocates the object.
lat_field = "lat"
lon_field = "lon"
# The event's own confidence field; as an attribute it would be quarantined.
confidence_field = "confidence"

# Record field = Ajar attribute key.
[mapping.attributes]
bearing = "course"

# Record field = metadata key. track_id keeps each object its own track.
[mapping.metadata]
# Vendor vocabulary, so metadata.
class = "object_class"
track_id = "source_uid"
camera_id = "camera_id"
bbox_x = "bbox_x"
bbox_y = "bbox_y"
bbox_w = "bbox_w"
bbox_h = "bbox_h"
