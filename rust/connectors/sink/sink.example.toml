#
# Example sink config. Run: ajar-sink run|audit|stats ./sink.toml

nats_url = "nats://127.0.0.1:4222"
# Every connector on the bus; "ajar.ingest.demo-radar" narrows it to one source.
subject = "ajar.ingest.>"
database = "./ajar-sink.db"

# Accepted publishers and their hex verifying keys, from scripts/gen-connector-key.sh.
# A source that is not listed is refused.
[sources]
"acme-radar-1" = "<64-char hex verifying key, from scripts/gen-connector-key.sh>"
