# SPDX-License-Identifier: Apache-2.0
[package]
name = "ajar-sink"
description = "Reference sink: verify sealed events, persist them, and prove the audit chain. For development and evaluation, not a governance plane."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "ajar-sink"
path = "src/main.rs"

[dependencies]
ajar-connector.workspace = true
ajar-connector-common.workspace = true
async-nats.workspace = true
tokio.workspace = true
futures-util.workspace = true
serde.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
hex.workspace = true
prost = "0.14"
sha2 = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
