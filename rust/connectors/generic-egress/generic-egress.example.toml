# SPDX-License-Identifier: Apache-2.0
#
# Governed events out of Ajar, delivered as consumer-shaped JSON over HTTP.
# `ajar-connectors join` writes the first four keys from the invite and --target, the rest
# from the instance's settings.toml. Run by hand: ajar-generic-egress ./generic-egress.toml

# tls:// in production, with this consumer's subscribe-only identity in AJAR_TLS_*.
nats_url = "tls://ajar.example.mil:4222"
# Must start with ajar.egress.; the certificate decides what is actually seen.
egress_subject = "ajar.egress.signed.>"
# A file holding Core's egress verifying key as 64 hex characters: the invite's egress.pub.
egress_verifying_key = "/etc/ajar/egress.pub"
# One HTTP POST of one JSON object per event.
target = "https://consumer.example.com/ajar/events"

[deliver]
# Attempts per event before it is counted as dropped.
# attempts = 2
[deliver.headers]
Authorization = "Bearer <token the consumer issued>"

# Consumer field name = event path: id, source_id, entity_type, timestamp, lat,
# lon, alt_m, confidence, policy_tags, attr:<name>, meta:<name>. The event id,
# policy tags and governance block are always delivered; mapping renames them.
[mapping]
trackId = "meta:source_uid"
kind = "entity_type"
latitude = "lat"
longitude = "lon"
speedMs = "attr:speed"
marking = "policy_tags"

# Content the mapping does not name: "include" (under `unmapped`) or "refuse" (event rejected).
# unmapped = "include"

# Adds a STANAG 4774-shaped label projected from the policy tags.
# [confidentiality_label]
# policy_identifier = "AJAR-DEPLOYMENT-POLICY"
