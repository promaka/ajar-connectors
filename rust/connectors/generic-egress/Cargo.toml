# SPDX-License-Identifier: Apache-2.0
[package]
name = "ajar-generic-egress"
description = "Governed events out of Ajar, verified and delivered as consumer-shaped JSON over HTTP."
version = "0.6.7"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "ajar-generic-egress"
path = "src/main.rs"

[dependencies]
ajar-connector.workspace = true
ajar-connector-common.workspace = true
async-nats.workspace = true
tokio.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
thiserror.workspace = true
hex.workspace = true
prost.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-no-provider", "json"] }

# See CONTRIBUTING.md, "Releases".
[package.metadata.ajar]
release = true
