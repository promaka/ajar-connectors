#
# AIS and ARPA radar (TTM) ingress from an NMEA 0183 feed.
# Run: ajar-ais-nmea ./ais-nmea.toml

source_id = "ais-coast-1"
nats_url = "nats://127.0.0.1:4222"
subject_prefix = "ajar.ingest"
signing_key_path = "/etc/ajar/ais-coast-1.seed"

# AIS carries no hostility; set the one the picture should show.
default_hostility = "Neutral"

# Security marking stamped into every event; all fields optional.
# [marking]
# classification = "restricted"
# releasable_to = ["GBR", "ITA"]
# caveats = ["EXERCISE"]

[transport]
# An AIS aggregator or ship-network NMEA server streaming one sentence per line.
kind = "tcp-client"
connect = "ais-feed.example.mil:5631"

# Or a receiver that sends one sentence per UDP datagram:
#   kind = "udp"
#   bind = "0.0.0.0:10110"

# Or the bridge's RS-422/RS-232 wiring; the service user needs the port's group:
#   kind = "serial"
#   device = "/dev/ttyUSB0"
#   # AIS runs at 38400; classic NMEA instruments at 4800.
#   baud = 38400

# Fixed site for a shore radar's TTM targets; a GGA/RMC fix on the feed wins.
# [sensor]
# lat = 60.39
# lon = 5.32
