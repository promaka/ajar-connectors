# SPDX-License-Identifier: Apache-2.0
#
# ADS-B ingress from an SBS-1 (BaseStation) feed. Run: ajar-adsb ./adsb.toml

source_id = "adsb-tower-1"
nats_url = "nats://127.0.0.1:4222"
subject_prefix = "ajar.ingest"
signing_key_path = "/etc/ajar/adsb-tower-1.seed"

# ADS-B carries no hostility; set the one the picture should show.
default_hostility = "Neutral"

# Security marking stamped into every event; all fields optional.
# [marking]
# classification = "restricted"
# releasable_to = ["GBR", "ITA"]
# caveats = ["EXERCISE"]

[transport]
# dump1090 / readsb SBS-1 output.
kind = "tcp-client"
connect = "127.0.0.1:30003"
framing = "line"

# Or listen for a receiver that pushes its feed:
#   kind = "tcp-server"
#   bind = "0.0.0.0:30003"
#   framing = "line"
