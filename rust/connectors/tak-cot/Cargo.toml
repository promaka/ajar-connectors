# SPDX-License-Identifier: Apache-2.0
[package]
name = "ajar-tak-cot"
description = "Ajar ingress connector for TAK / Cursor-on-Target (CoT) situational-awareness feeds."
version = "0.6.7"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "ajar-tak-cot"
path = "src/main.rs"

[features]
# Inert unless a config sets kind = "dds"; --no-default-features drops it.
default = ["dds"]
dds = ["ajar-connector-common/dds"]

[dependencies]
ajar-connector.workspace = true
ajar-connector-common.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
thiserror.workspace = true
quick-xml.workspace = true

[dev-dependencies]
ed25519-dalek.workspace = true
sha2.workspace = true
hex.workspace = true
serde_json.workspace = true
proptest.workspace = true
uuid.workspace = true

# See CONTRIBUTING.md, "Releases".
[package.metadata.ajar]
release = true
