# SPDX-License-Identifier: Apache-2.0
#
# TAK / Cursor-on-Target ingress. Run: ajar-tak-cot ./tak-cot.toml

source_id = "tak-field-1"
nats_url = "nats://127.0.0.1:4222"
subject_prefix = "ajar.ingest"
signing_key_path = "/etc/ajar/tak-field-1.seed"

# Security marking stamped into every event; all fields optional.
# [marking]
# classification = "restricted"
# releasable_to = ["GBR", "ITA"]
# caveats = ["EXERCISE"]

[transport]
# udp-multicast (the CoT SA default) or udp.
kind = "udp-multicast"
bind = "0.0.0.0:6969"
# The SA group ATAK/WinTAK broadcast on.
group = "239.2.3.1"

# CoT type code to Ajar entity type; unlisted types fall back to air/sea or x:cot:<type>.
[entity_map]
"a-f-G-U-C-D" = "mim:unit"

# Store-and-forward while NATS is unreachable:
# spool = "/var/lib/ajar/spool"
# Or with a bound and replay rate:
# [spool]
# dir = "/var/lib/ajar/spool"
# max_bytes = 268435456
# drain_rate = 50.0
