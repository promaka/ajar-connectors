#
# STANAG 4676 (NATO ISR Tracking) ingress, one event per track point.
# Run: ajar-stanag4676 ./stanag4676.toml

source_id = "isr-tracker-1"
nats_url = "nats://127.0.0.1:4222"
subject_prefix = "ajar.ingest"
signing_key_path = "/etc/ajar/isr-tracker-1.seed"

# Used only when a track's STANAG 1241 identity is absent or UNKNOWN.
# default_hostility = "Unknown"

# Security marking stamped into every event; all fields optional.
# [marking]
# classification = "restricted"
# releasable_to = ["GBR", "ITA"]
# caveats = ["EXERCISE"]

# Tracks are mim:object by default; map an environment to a specific type.
# [entity_map]
# AIR = "mim:aircraft"

[transport]
# One whole XML message per frame.
kind = "tcp-server"
bind = "0.0.0.0:4676"
framing = "length-delimited"

# Or read a file of single-line messages:
#   kind = "file"
#   path = "/var/spool/isr/tracks.xml"
