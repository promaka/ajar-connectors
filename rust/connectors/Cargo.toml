# SPDX-License-Identifier: Apache-2.0
#
# Connectors workspace — shippable, PRODUCTION connectors, distinct from the
# teaching `examples/` workspace. Kept out of the SDK workspace so transport-heavy
# deps (async-nats, tokio, socket2, format parsers) never reach the SDK's tree.
#
# `common` is the shared connector runtime: config, key loading, mTLS NATS,
# transports, the seal-and-publish loop, health/metrics, and graceful shutdown. A
# new connector is then just a format parser plus a few lines of wiring — see
# `tak-cot` for the pattern.
[workspace]
resolver = "2"
members = [
    "common",
    "doctor",
    "up",
    "tak-cot",
    "ais-nmea",
    "mavlink",
    "asterix",
    "adsb",
    "generic",
    "klv",
    "gmti",
    "stanag4676",
    "stanag4586",
    "sink",
    "tak-egress",
    "generic-egress",
    "feed-synthetic",
    "sapient-wire",
    "sapient",
    "sapient-egress",
]

# No shared `version`: every crate carries its own, and a connector with
# `[package.metadata.ajar] release = true` is released on its own tag. See
# CONTRIBUTING.md, "Releases".
[workspace.package]
edition = "2021"
rust-version = "1.74"
license = "Apache-2.0"
repository = "https://github.com/promaka/ajar-connectors"
authors = ["Ajar connectors contributors"]

[workspace.dependencies]
ajar-connector = { path = "../ajar-connector" }
ajar-connector-common = { path = "common" }
# `ring` for TLS; `jetstream` for the spool drain's acked replay (the cursor
# advances only on a PubAck, so a replayed event is provably stored, not just
# sent). default-features = false avoids a `time` coherence clash on this
# toolchain.
async-nats = { version = "0.50", default-features = false, features = ["ring", "jetstream"] }
# The seal signs with the connector's own Ed25519 key; the SDK takes the dalek
# type directly, so we hold the key in the same type it expects.
ed25519-dalek = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "signal", "io-util", "io-std", "fs", "process"] }
bytes = "1"
# Multicast needs SO_REUSEADDR/REUSEPORT so a connector can share a group with
# another consumer (e.g. ATAK) on the same host; tokio's UdpSocket can't set that.
socket2 = { version = "0.6", features = ["all"] }
serde = { version = "1", features = ["derive"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
hex = "0.4"
# The SAPIENT wire crate compiles the vendored BSI Flex 335 schema with the same
# protobuf toolchain the SDK uses for the event contract: prost, and a vendored
# protoc so a fresh build needs no system protoc.
prost = "0.14"
prost-types = "0.14"
prost-build = "0.14"
protoc-bin-vendored = "3"
time = { version = "0.3", features = ["formatting", "parsing"] }
serde_json = "1"
async-trait = "0.1"
# Egress-side TLS client (TAK Server streaming input). ring only — a second
# rustls crypto provider in the process would clash with async-nats's.
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pki-types = { version = "1", features = ["std"] }
futures-util = "0.3"
