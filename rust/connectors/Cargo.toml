# SPDX-License-Identifier: Apache-2.0
# Shipped connectors, kept apart from the SDK so transport dependencies never reach its tree.
[workspace]
resolver = "2"
members = [
    "common",
    "doctor",
    "up",
    "tak-cot",
    "ais-nmea",
    "mavlink",
    "asterix",
    "adsb",
    "generic",
    "klv",
    "gmti",
    "stanag4676",
    "stanag4586",
    "sink",
    "tak-egress",
    "generic-egress",
    "feed-synthetic",
    "sapient-wire",
    "sapient",
    "sapient-egress",
]

# No shared version: each crate is versioned and released on its own.
[workspace.package]
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/promaka/ajar-connectors"
authors = ["Ajar connectors contributors"]

[workspace.dependencies]
ajar-connector = { path = "../ajar-connector" }
ajar-connector-common = { path = "common" }
# jetstream: the spool drain advances only on a PubAck. No default features: they clash on `time`.
async-nats = { version = "0.50", default-features = false, features = ["ring", "jetstream"] }
ed25519-dalek = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "signal", "io-util", "io-std", "fs", "process"] }
bytes = "1"
# SO_REUSEADDR/REUSEPORT for shared multicast groups, which tokio's UdpSocket cannot set.
socket2 = { version = "0.6", features = ["all"] }
serde = { version = "1", features = ["derive"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
tempfile = "3"
hex = "0.4"
# The SDK's protobuf toolchain, with a vendored protoc.
prost = "0.14"
prost-types = "0.14"
prost-build = "0.14"
protoc-bin-vendored = "3"
time = { version = "0.3", features = ["formatting", "parsing"] }
serde_json = "1"
async-trait = "0.1"
# ring only: a second rustls crypto provider would clash with async-nats's.
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pki-types = { version = "1", features = ["std"] }
futures-util = "0.3"
proptest = "1"
uuid = "1"
sha2 = "0.11"
quick-xml = "0.42"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
