# SPDX-License-Identifier: Apache-2.0
[package]
name = "ajar-gmti"
description = "Ajar ingress connector for STANAG 4607 (NATO GMTI) Dwell-segment moving-target reports."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "ajar-gmti"
path = "src/main.rs"

[features]
# DDS is compiled in so the shipped binary can read a topic on a ship's or a
# ROS 2 platform's bus; it is inert unless a config says kind = "dds".
# A lean build is one flag away: --no-default-features.
default = ["dds"]
dds = ["ajar-connector-common/dds"]

[dependencies]
ajar-connector.workspace = true
ajar-connector-common.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true

[dev-dependencies]
ed25519-dalek.workspace = true
hex.workspace = true
serde_json = "1"
proptest = "1"
uuid = "1"
