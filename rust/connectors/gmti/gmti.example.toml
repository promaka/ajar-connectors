#
# STANAG 4607 (NATO GMTI) ingress, one event per target report.
# Run: ajar-gmti ./gmti.toml

source_id = "gmti-radar-1"
nats_url = "nats://127.0.0.1:4222"
subject_prefix = "ajar.ingest"
signing_key_path = "/etc/ajar/gmti-radar-1.seed"

# GMTI carries no hostility; set the one the picture should show.
default_hostility = "Unknown"

# Security marking stamped into every event; all fields optional.
# [marking]
# classification = "restricted"
# releasable_to = ["GBR", "ITA"]
# caveats = ["EXERCISE"]

[transport]
# One GMTI packet per UDP datagram.
kind = "udp"
bind = "0.0.0.0:15005"

# Or read length-delimited packets pushed over TCP:
#   kind = "tcp-server"
#   bind = "0.0.0.0:15005"
#   framing = "length-delimited"
