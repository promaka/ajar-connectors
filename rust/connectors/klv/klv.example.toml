# SPDX-License-Identifier: Apache-2.0
#
# STANAG 4609 / MISB ST 0601 (KLV) ingress from a UAS metadata stream.
# Run: ajar-klv ./klv.toml

source_id = "uas-klv-1"
nats_url = "nats://127.0.0.1:4222"
subject_prefix = "ajar.ingest"
signing_key_path = "/etc/ajar/uas-klv-1.seed"

# KLV carries no hostility; set the one the picture should show.
default_hostility = "Friend"

# Security marking stamped into every event; all fields optional.
# [marking]
# classification = "restricted"
# releasable_to = ["GBR", "ITA"]
# caveats = ["EXERCISE"]

[transport]
# One KLV set per UDP datagram.
kind = "udp"
bind = "0.0.0.0:15004"

# Or read length-delimited sets pushed over TCP:
#   kind = "tcp-server"
#   bind = "0.0.0.0:15004"
#   framing = "length-delimited"
