# SPDX-License-Identifier: Apache-2.0
[package]
name = "ajar-connector-common"
description = "Shared runtime for Ajar connectors: config, mTLS transport, seal-and-publish loop, health."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[features]
# The heavier transports are opt-in so the default build stays lean for
# air-gapped deployment; a connector enables only the method(s) it needs.
serial = ["dep:tokio-serial"]
mqtt = ["dep:rumqttc"]
rest-poll = ["dep:reqwest"]
websocket = ["dep:tokio-tungstenite", "dep:futures-util"]

[dependencies]
ajar-connector.workspace = true
ed25519-dalek.workspace = true
async-nats.workspace = true
tokio.workspace = true
bytes.workspace = true
socket2.workspace = true
serde.workspace = true
toml.workspace = true
tracing.workspace = true
anyhow.workspace = true
hex.workspace = true
serde_json.workspace = true
async-trait.workspace = true
# Server-side TLS for the http-server transport (same ring-only stack as tak-egress).
tokio-rustls.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
# Feature-gated transport dependencies.
tokio-serial = { version = "5", optional = true }
rumqttc = { version = "0.25", default-features = false, features = ["use-rustls-no-provider"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-no-provider"], optional = true }
# ring, to match the one crypto provider already in the process (see workspace note).
futures-util = { workspace = true, optional = true }
tokio-tungstenite = { version = "0.30", default-features = false, features = [
    "connect",
    "handshake",
    "rustls-tls-webpki-roots",
], optional = true }

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
proptest = "1"
