# SPDX-License-Identifier: Apache-2.0
[package]
name = "ajar-connector-common"
description = "Shared runtime for Ajar connectors: config, mTLS transport, seal-and-publish loop, health."
version = "0.6.6"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[[example]]
name = "dds_probe"
required-features = ["dds"]

[features]
# Opt-in to keep builds lean for air-gapped sites. dds is pure Rust, no C bindings.
serial = ["dep:tokio-serial"]
mqtt = ["dep:rumqttc"]
rest-poll = ["dep:reqwest"]
websocket = ["dep:tokio-tungstenite", "dep:futures-util"]
dds = ["dep:rustdds", "dep:futures-util"]

[dependencies]
ajar-connector.workspace = true
ed25519-dalek.workspace = true
async-nats.workspace = true
tokio.workspace = true
bytes.workspace = true
socket2.workspace = true
serde.workspace = true
toml.workspace = true
tracing.workspace = true
anyhow.workspace = true
hex.workspace = true
serde_json.workspace = true
async-trait.workspace = true
thiserror.workspace = true
tokio-rustls.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
tokio-serial = { version = "5", optional = true }
# The *-no-provider features keep ring the only rustls crypto provider.
rumqttc = { version = "0.25", default-features = false, features = ["use-rustls-no-provider"], optional = true }
rustdds = { version = "0.14", default-features = false, optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-no-provider"], optional = true }
futures-util = { workspace = true, optional = true }
tokio-tungstenite = { version = "0.30", default-features = false, features = [
    "connect",
    "handshake",
    "rustls-tls-webpki-roots",
], optional = true }

[dev-dependencies]
rcgen.workspace = true
proptest.workspace = true
tempfile.workspace = true
futures-util.workspace = true
