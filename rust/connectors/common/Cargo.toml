# SPDX-License-Identifier: Apache-2.0
[package]
name = "ajar-connector-common"
description = "Shared runtime for Ajar connectors: config, mTLS transport, seal-and-publish loop, health."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[features]
# The heavier transports are opt-in so the default build stays lean for
# air-gapped deployment; a connector enables only the method(s) it needs.
serial = ["dep:tokio-serial"]
mqtt = ["dep:rumqttc"]
rest-poll = ["dep:reqwest"]

[dependencies]
ajar-connector.workspace = true
ed25519-dalek.workspace = true
async-nats.workspace = true
tokio.workspace = true
bytes.workspace = true
socket2.workspace = true
serde.workspace = true
toml.workspace = true
tracing.workspace = true
anyhow.workspace = true
hex.workspace = true
async-trait.workspace = true
# Feature-gated transport dependencies.
tokio-serial = { version = "5", optional = true }
rumqttc = { version = "0.24", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"], optional = true }

[dev-dependencies]
proptest = "1"
