#
# STANAG 4586 (NATO UAS Control) ingress from a VSM's Data Link Interface.
# Run: ajar-stanag4586 ./stanag4586.toml

source_id = "uas-vsm-1"
nats_url = "nats://127.0.0.1:4222"
subject_prefix = "ajar.ingest"
signing_key_path = "/etc/ajar/uas-vsm-1.seed"

# 4586 carries no hostility; set the one the picture should show.
default_hostility = "Friend"

# Security marking stamped into every event; all fields optional.
# [marking]
# classification = "restricted"
# releasable_to = ["GBR", "ITA"]
# caveats = ["EXERCISE"]

# Entity type for decoded vehicles; defaults to mim:aircraft.
# [entity_map]
# default = "mim:aircraft"

[transport]
# The VSM's DLI output; use udp-multicast if it multicasts.
kind = "udp"
bind = "0.0.0.0:4586"
