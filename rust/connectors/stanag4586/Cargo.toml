# SPDX-License-Identifier: Apache-2.0
[package]
name = "ajar-stanag4586"
description = "Ajar ingress connector for STANAG 4586 (NATO UAS Control) Data Link Interface messages."
version = "0.6.6"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "ajar-stanag4586"
path = "src/main.rs"

[features]
# Inert unless a config sets kind = "dds"; --no-default-features drops it.
default = ["dds"]
dds = ["ajar-connector-common/dds"]

[dependencies]
ajar-connector.workspace = true
ajar-connector-common.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
thiserror.workspace = true
time.workspace = true

[dev-dependencies]
ed25519-dalek.workspace = true
hex.workspace = true
serde_json.workspace = true
proptest.workspace = true
uuid.workspace = true

# See CONTRIBUTING.md, "Releases".
[package.metadata.ajar]
release = true
