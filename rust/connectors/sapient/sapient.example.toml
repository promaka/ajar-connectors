# SPDX-License-Identifier: Apache-2.0
#
# SAPIENT (BSI Flex 335) ingress: edge node registrations, status, detections,
# tracks and alerts. Run: ajar-sapient ./sapient.toml

source_id = "sapient-fusion-1"
nats_url = "nats://127.0.0.1:4222"
subject_prefix = "ajar.ingest"
signing_key_path = "/etc/ajar/sapient-fusion-1.seed"

# SAPIENT carries no hostility; set the one the picture should show.
# default_hostility = "Suspect"

# Security marking stamped into every event; all fields optional.
# [marking]
# classification = "restricted"
# releasable_to = ["GBR", "ITA"]
# caveats = ["EXERCISE"]

# Entity type per SAPIENT classification (case-insensitive); unmapped stay sapient:.
# [entity_map]
# "UAV" = "mim:aircraft"
# "Person" = "mim:person"

[options]
# dmm: edge nodes connect here and register. subscriber: read a fusion node's output or a capture.
role = "dmm"
# This fusion node's UUID in every acknowledgement; minted at start-up when unset.
# node_id = "2f1c6a1e-4a5e-4b7e-9b1a-0d3f2e6c7a11"

# Entity type per report kind, for a site without the sapient: types registered.
# [options.types]
# detection = "mim:object"
# track = "mim:aircraft"
# sensor_status = "mim:sensor"
# alert = "mim:action"

[transport]
# The dmm role needs tcp-server and always applies the standard's framing.
kind = "tcp-server"
bind = "0.0.0.0:7777"
framing = "length-u32le"

# Or, with role = "subscriber", a fusion node's output:
#   kind = "tcp-client"
#   connect = "fusion-node:7777"
#   framing = "length-u32le"

# Or a recorded capture, replayed from the start:
#   kind = "file"
#   path = "/var/ajar/captures/sapient-bench.bin"
#   from_start = true
#   framing = "length-u32le"
