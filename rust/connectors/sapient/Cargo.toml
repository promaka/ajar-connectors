# SPDX-License-Identifier: Apache-2.0
[package]
name = "ajar-sapient"
description = "Ajar ingress connector for SAPIENT (BSI Flex 335): detections, tracks, sensor status and alerts from edge nodes or a fusion node, as signed events."
version = "0.6.6"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "ajar-sapient"
path = "src/main.rs"

[features]
# Inert unless a config sets kind = "dds"; --no-default-features drops it.
default = ["dds"]
dds = ["ajar-connector-common/dds"]

[dependencies]
ajar-connector.workspace = true
ajar-connector-common.workspace = true
ajar-sapient-wire = { path = "../sapient-wire" }
prost.workspace = true
prost-types.workspace = true
serde.workspace = true
toml.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
thiserror.workspace = true
async-trait.workspace = true
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
ed25519-dalek.workspace = true
hex.workspace = true
serde_json.workspace = true
proptest = "1"

# See CONTRIBUTING.md, "Releases".
[package.metadata.ajar]
release = true
