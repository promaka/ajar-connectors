# SPDX-License-Identifier: Apache-2.0
[package]
name = "ajar-sapient"
description = "Ajar ingress connector for SAPIENT (BSI Flex 335): detections, tracks, sensor status and alerts from edge nodes or a fusion node, as signed events."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "ajar-sapient"
path = "src/main.rs"

[features]
# DDS is compiled in so the shipped binary can read a topic on a ship's or a
# ROS 2 platform's bus; it is inert unless a config says kind = "dds".
default = ["dds"]
dds = ["ajar-connector-common/dds"]

[dependencies]
ajar-connector.workspace = true
ajar-connector-common.workspace = true
ajar-sapient-wire = { path = "../sapient-wire" }
prost.workspace = true
prost-types.workspace = true
serde.workspace = true
toml.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
ed25519-dalek.workspace = true
hex.workspace = true
serde_json = "1"
proptest = "1"
