#
# ASTERIX ingress: CAT010, CAT021, CAT048 and CAT062 tracks, CAT034 radar
# heartbeats. Run: ajar-asterix ./asterix.toml

source_id = "radar-adsb-1"
nats_url = "nats://127.0.0.1:4222"
subject_prefix = "ajar.ingest"
signing_key_path = "/etc/ajar/radar-adsb-1.seed"

# ASTERIX carries no hostility; set the one the picture should show.
# default_hostility = "Unknown"

# Security marking stamped into every event; all fields optional.
# [marking]
# classification = "restricted"
# releasable_to = ["GBR", "ITA"]
# caveats = ["EXERCISE"]

# Radar site; without it CAT048 and CAT010 sensor-relative plots carry no location.
# [sensor]
# lat = 60.31
# lon = 24.97
# alt_m = 55.0

# [entity_map]
# Domain of an unidentified CAT010 plot: SURFACE, LAND, SUBSURFACE or AIR.
# cat010_domain = "SURFACE"
# Entity type for every CAT010 plot, instead of one implied by its content.
# cat010 = "mim:vessel"
# Entity type of the CAT034 heartbeat; default mim:sensor.
# cat034 = "mim:sensor"

[transport]
kind = "udp-multicast"
bind = "0.0.0.0:8600"
group = "232.1.1.1"

# Or replay a pcap capture with its original timing (tshark -F pcap converts pcapng):
#   kind = "pcap-replay"
#   path = "/data/radar-capture.pcap"
#   port = 8600         # only this UDP port
#   speed = 1.0         # 1.0 = as recorded
#   loop = true

# Or subscribe to a DDS topic of ASTERIX blocks; type_name must match the publisher's:
#   kind = "dds"
#   domain = 0
#   topic = "RadarAsterix"
#   type_name = "Radar::AsterixBlock"
#   payload = "octets"  # the sequence<octet> field, without its length
#   reliability = "best-effort"  # pairs with any publisher
#   interface_ip = "10.0.5.12"   # the NIC on the DDS network
