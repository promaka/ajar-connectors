#
# MAVLink (UAS autopilot) ingress. Run: ajar-mavlink ./mavlink.toml

source_id = "uav-flight-1"
nats_url = "nats://127.0.0.1:4222"
subject_prefix = "ajar.ingest"
signing_key_path = "/etc/ajar/uav-flight-1.seed"

# MAVLink carries no hostility; set the one the picture should show.
default_hostility = "Friend"

# Security marking stamped into every event; all fields optional.
# [marking]
# classification = "restricted"
# releasable_to = ["GBR", "ITA"]
# caveats = ["EXERCISE"]

# Vehicles sharing one stream need distinct SYSID_THISMAV (ArduPilot and PX4
# default to 1); two with the same id merge into one track.
[transport]
# Autopilots and ground stations commonly forward MAVLink over UDP.
kind = "udp"
bind = "0.0.0.0:14550"
