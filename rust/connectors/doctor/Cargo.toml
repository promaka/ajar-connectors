# SPDX-License-Identifier: Apache-2.0
[package]
name = "ajar-doctor"
description = "Preflight diagnostics for Ajar connectors: checks the config, key, registration, endpoint, TLS and clock, and says which onboarding step failed in plain words."
version = "0.6.6"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "ajar-doctor"
path = "src/main.rs"

[features]
# Same default as the serial- and DDS-capable connectors it ships with.
default = ["serial", "dds"]
serial = ["ajar-connector-common/serial"]
dds = ["ajar-connector-common/dds"]

[dependencies]
ajar-connector-common.workspace = true
ed25519-dalek.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
serde_json.workspace = true
anyhow.workspace = true
hex.workspace = true
# Subject CN, SAN list and validity window, which rustls does not expose.
x509-parser = "0.17"

[dev-dependencies]
# Throwaway PKI for the failure matrix; ring only, like the rest of the workspace.
rcgen.workspace = true
# Shifts certificate validity windows for the expired and postdated cases.
time.workspace = true
tempfile.workspace = true

# See CONTRIBUTING.md, "Releases".
[package.metadata.ajar]
release = true
