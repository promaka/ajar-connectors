# SPDX-License-Identifier: Apache-2.0
[workspace]
resolver = "2"
members = [
    "ajar-connector",
    "ajar-verify",
    "conformance",
]
# Examples live in their own workspace (rust/examples/Cargo.toml) so heavier,
# transport-specific deps (e.g. async-nats and its async runtime) resolve their
# own dependency graph independently of the SDK crate — keeping the SDK's
# dependency tree minimal and avoiding cross-crate version clashes.
exclude = ["examples", "connectors"]

[workspace.package]
version = "0.5.2"
edition = "2021"
rust-version = "1.74"
license = "Apache-2.0"
repository = "https://github.com/promaka/ajar-connectors"
authors = ["Ajar connectors contributors"]

[workspace.dependencies]
ajar-connector = { path = "ajar-connector" }
prost = "0.14"
prost-build = "0.14"
protoc-bin-vendored = "3"
ed25519-dalek = "3"
sha2 = "0.11"
hex = "0.4"
uuid = { version = "1", features = ["v7"] }
# Only `formatting` (RFC 3339 output for EventBuilder::now); the SDK never parses
# timestamps. Keeping `parsing` off also avoids a coherence clash with async-nats
# in the examples workspace (time's parsing impls vs its blanket From impl).
time = { version = "0.3", features = ["formatting"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
thiserror = "2"
