# SPDX-License-Identifier: Apache-2.0
[workspace]
resolver = "2"
members = [
    "ajar-connector",
    "ajar-verify",
    "conformance",
]
# Separate workspaces, so their transport dependencies stay out of the SDK's lockfile.
exclude = ["examples", "connectors"]

[workspace.package]
version = "0.6.6"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/promaka/ajar-connectors"
authors = ["Ajar connectors contributors"]

[workspace.dependencies]
ajar-connector = { path = "ajar-connector" }
prost = "0.14"
prost-build = "0.14"
protoc-bin-vendored = "3"
ed25519-dalek = "3"
sha2 = "0.11"
hex = "0.4"
uuid = { version = "1", features = ["v7"] }
# No `parsing`: it clashes with async-nats in the examples workspace.
time = { version = "0.3", features = ["formatting"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
thiserror = "2"
anyhow = "1"

# Unoptimised curve math makes signing tests slow; ours keep debug info.
[profile.test.package.curve25519-dalek]
opt-level = 3
[profile.test.package.ed25519-dalek]
opt-level = 3
[profile.test.package.sha2]
opt-level = 3
