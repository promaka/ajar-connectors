# SPDX-License-Identifier: Apache-2.0
[workspace]
resolver = "2"
members = [
    "ajar-connector",
    "conformance",
    "examples/cot-connector",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
license = "Apache-2.0"
repository = "https://github.com/promaka/ajar-connectors"
authors = ["Ajar connectors contributors"]

[workspace.dependencies]
ajar-connector = { path = "ajar-connector" }
prost = "0.13"
prost-build = "0.13"
protoc-bin-vendored = "3"
ed25519-dalek = "2"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v7"] }
time = { version = "0.3", features = ["formatting", "parsing"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
thiserror = "1"
