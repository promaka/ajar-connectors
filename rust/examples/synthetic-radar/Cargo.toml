# SPDX-License-Identifier: Apache-2.0
[package]
name = "synthetic-radar"
description = "Example: stream synthetic mim:aircraft tracks into a local Ajar Core over NATS."
version = "0.6.7"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
ajar-connector.workspace = true
# No default features avoids async-nats's optional `time` dep (E0119); `ring` re-adds the TLS provider.
# Without `ring` a TLS connect panics: "Could not automatically determine the process-level CryptoProvider".
async-nats = { version = "0.51", default-features = false, features = ["ring"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
bytes = "1"
# Decodes the 64-char hex seed `ajar keygen` writes.
hex = "0.4"

# See CONTRIBUTING.md, "Releases".
[package.metadata.ajar]
release = true
