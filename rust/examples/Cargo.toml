# SPDX-License-Identifier: Apache-2.0
# Separate from the SDK workspace so examples can pull transport dependencies.
[workspace]
resolver = "2"
members = [
    "conformance-adapter",
    "connector-template",
    "cot-connector",
    "synthetic-radar",
]

[workspace.package]
version = "0.6.6"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/promaka/ajar-connectors"
authors = ["Ajar connectors contributors"]

[workspace.dependencies]
ajar-connector = { path = "../ajar-connector" }
