# SPDX-License-Identifier: Apache-2.0
[package]
name = "connector-template"
description = "Copy-me starting point for a new Ajar connector: make two edits and run."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
ajar-connector.workspace = true
# `ring` re-adds the rustls crypto provider TLS to NATS needs.
async-nats = { version = "0.52", default-features = false, features = ["ring"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util", "io-std"] }
bytes = "1"
serde = { version = "1", features = ["derive"] }
# EDIT: swap serde_json for whatever your feed speaks.
serde_json = "1"
# Decodes the 64-char hex seed `ajar keygen` writes.
hex = "0.4"
