# SPDX-License-Identifier: Apache-2.0
[package]
name = "connector-template"
description = "Copy-me starting point for a new Ajar connector: make two edits and run."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
ajar-connector.workspace = true
# Transport + your feed parser. Swap serde_json for whatever your feed speaks.
# `ring`: selects the rustls crypto provider — REQUIRED for TLS/mTLS to NATS.
# (default-features=false drops async-nats's heavy jetstream/kv/service defaults,
# but that also drops the provider, so we re-add just `ring`.)
async-nats = { version = "0.49", default-features = false, features = ["ring"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util", "io-std"] }
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Accept the 64-char hex seed `ajar keygen` writes, not just 32 raw bytes.
hex = "0.4"
