{{- if .Values.networkPolicy.enabled }}
# Egress lockdown: the connector may reach only NATS (+ DNS), mirroring Core's
# no-egress posture. All other outbound traffic is denied.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "connector.fullname" . }}
  labels:
    {{- include "connector.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "connector.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    # DNS resolution.
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # NATS only.
    - ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.natsPort }}
{{- end }}
