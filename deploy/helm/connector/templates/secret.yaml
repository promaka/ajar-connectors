{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- if .Values.signingSeed.create }}
{{- if not .Values.signingSeed.valueBase64 }}
{{- fail "signingSeed.create is true but signingSeed.valueBase64 is empty" }}
{{- end }}
# DEV ONLY: the chart creates the seed Secret from an inline base64 value.
# In production, set signingSeed.existingSecret to a Secret from your manager.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "connector.seedSecretName" . }}
  labels:
    {{- include "connector.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.signingSeed.secretKey }}: {{ .Values.signingSeed.valueBase64 | quote }}
{{- end }}
