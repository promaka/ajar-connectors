# SPDX-License-Identifier: Apache-2.0
apiVersion: v2
name: connector
description: >-
  Deploy an Ajar connector into Kubernetes — the same clean way Core deploys
  (pairs with the Core chart in promaka/ajar, deploy/helm/ajar). Generic: you
  supply a connector image and its TOML config; the chart renders the config into
  a ConfigMap and passes it to the connector, wires the signing key (from a
  Secret), optional mTLS, and an optional egress-only-to-NATS NetworkPolicy. It
  does not deploy NATS or Core.
type: application
# The chart is versioned and released on its own, as the tag chart-vX.Y.Z; bump
# this with deploy/helm/connector/CHANGELOG.md. It deploys any connector, each at
# its own version, so the image is always named by image.tag or image.digest and
# appVersion follows the chart rather than any one connector.
version: 0.6.6
appVersion: "0.6.6"
keywords:
  - ajar
  - connector
  - defence
home: https://github.com/promaka/ajar-connectors
sources:
  - https://github.com/promaka/ajar-connectors
maintainers:
  - name: Ajar connectors contributors
annotations:
  # See CONTRIBUTING.md, "Releases".
  ajar.release: "true"
