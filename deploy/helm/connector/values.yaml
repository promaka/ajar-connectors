# SPDX-License-Identifier: Apache-2.0
# Values for the connector chart. Required: `image.repository` and a signing-key
# Secret (`signingSeed.existingSecret`). Pairs with the Core chart conventions.

replicaCount: 1

image:
  repository: ""          # REQUIRED — your built connector image, e.g. registry.you.mil/acme-radar
  # REQUIRED — pin a real version. Set EITHER an explicit tag (e.g. "1.0.0") OR a
  # digest below. A floating "latest" / empty tag is rejected at render time.
  tag: ""
  digest: ""              # recommended for prod: pin by digest, e.g. sha256:…
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Standard config the SDK reads as environment variables.
connector:
  sourceId: "demo-connector"        # must equal the AJAR_SOURCE_ID Ajar assigned you
  ingestPrefix: "ajar.ingest"       # subject is <prefix>.<sourceId>
  natsUrl: "nats://ajar-ajar-nats:4222"  # in-cluster NATS (or an external tls://… host)
  # REQUIRED — the connector's TOML, passed as its first argument. Every
  # connector on the shared runtime reads its identity, transport and key path
  # from this file; see each connector's <name>.example.toml.
  config: ""
  existingConfigMap: ""             # or manage the ConfigMap yourself
  configMountPath: "/etc/ajar/config/connector.toml"

# The connector's Ed25519 signing seed (32 raw bytes), mounted as a file and
# exposed to the connector via AJAR_SIGNING_SEED. Provide it as a Secret.
signingSeed:
  existingSecret: ""                # RECOMMENDED: name of a Secret holding the seed
  secretKey: "seed"                 # key within that Secret (32 raw bytes)
  mountPath: "/etc/ajar/seed"       # where it's mounted; AJAR_SIGNING_SEED points here
  # Dev only — let the chart create the Secret from an inline base64 value.
  # NEVER use this in production; put the seed in your secret manager instead.
  create: false
  valueBase64: ""

# Optional mTLS to NATS (production). Point at a Secret holding tls.crt / tls.key
# / ca.crt; the chart mounts them and sets AJAR_TLS_CERT / AJAR_TLS_KEY /
# AJAR_TLS_CA for the connector to use.
tls:
  existingSecret: ""                # e.g. a cert-manager / kubernetes.io/tls Secret
  mountPath: "/etc/ajar/tls"

# Health/metrics endpoint + Kubernetes probes. When enabled, the chart starts
# the connector with AJAR_HEALTH_ADDR=0.0.0.0:<port> and adds liveness/readiness
# probes hitting <livenessPath>. The reference image and the connector templates
# expose GET /healthz and GET /metrics (Prometheus) on that address. If YOUR
# connector image does not implement the endpoint, set enabled: false.
health:
  enabled: true
  port: 9090
  livenessPath: /healthz
  readinessPath: /healthz

# Optional egress lockdown: allow the connector to reach ONLY NATS (+ DNS),
# mirroring Core's no-egress posture.
networkPolicy:
  enabled: false
  natsPort: 4222

# Optional: extra env, volumes, and mounts.
extraEnv: []
extraVolumes: []
extraVolumeMounts: []

serviceAccount:
  create: true
  name: ""

# Hardened by default — must match Core's posture.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532                  # distroless nonroot uid — REQUIRED: distroless
                                    # uses a non-numeric user, so without an explicit
                                    # numeric uid the pod fails CreateContainerConfigError
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

resources:
  limits:
    cpu: 250m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
