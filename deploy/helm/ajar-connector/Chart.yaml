# SPDX-License-Identifier: Apache-2.0
apiVersion: v2
name: ajar-connector
description: >-
  Deploy an Ajar connector into Kubernetes. The chart is generic: you supply
  your built connector image and its config (source id, NATS endpoint), and the
  chart wires up the signing key (from a Secret) and the standard environment
  the SDK reads. It does not deploy NATS or Ajar Core — those are operator-side.
type: application
version: 0.1.0
appVersion: "0.1.0"
keywords:
  - ajar
  - connector
  - defence
home: https://github.com/promaka/ajar-connectors
sources:
  - https://github.com/promaka/ajar-connectors
maintainers:
  - name: Ajar connectors contributors
