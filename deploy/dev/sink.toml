# Sink config for the development stack (deploy/dev/compose.yml).
nats_url = "nats://nats:4222"
subject = "ajar.ingest.>"
database = "/var/lib/ajar/ajar-sink.db"

# The demo's publisher key is minted at startup (see compose.yml); its public
# half appears in /keys as demo-radar.pub and is registered from sources_dir.
# A production sink registers operator-supplied keys in [sources] instead:
#   [sources]
#   "acme-radar-1" = "<64-char hex verifying key>"
sources_dir = "/keys"

# Render each verified event as CoT onto ATAK's mesh SA multicast group, so a
# TAK client on this network shows the picture. Delete this section to run the
# stack headless. From a container, multicast reaches LAN clients only with
# host networking (Linux: `-f compose.map.yml`); on any host, the bare-binary
# path in the README works without Docker.
[cot]
multicast = "239.2.3.1:6969"
# interface = "192.168.1.20"   # the interface your TAK clients share
