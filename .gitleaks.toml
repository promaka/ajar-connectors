# SPDX-License-Identifier: Apache-2.0
#
# Secret scanning policy. CI runs gitleaks over the full history on every pull
# request: no real key, token or credential can land here.
#
# The ONLY key material permitted in this repository is the two published TEST
# constants below. Both are deliberately all-one-byte patterns, labelled at
# every use, and authorise nothing anywhere real:
#
#   0x47 * 32 — the conformance seed published in vendor/contract/vectors.json.
#               The golden vectors pin exact sealed bytes, so every SDK must
#               sign with the same seed to reproduce them (the same practice as
#               RFC 8032's published test vectors). Every other key in the
#               system is minted where it runs and never committed.
#
# Production seeds are generated by operators (scripts/gen-connector-key.sh),
# never committed, and *.key / *.seed are refused by .gitignore.

[extend]
useDefault = true

[allowlist]
description = "Published TEST vectors only — see header"
regexes = [
  '''(?:47){32}''',
  # The PUBLIC half of a discarded local test key, used once in an ONBOARDING
  # example and since replaced; lives on in history only. A verifying key
  # authorises nothing — the private half never existed outside a temp dir.
  '''be632a73306cf201f8222cd8766a4427f4c7224c0e55018012c28faed60e0892''',
  '''e28a8970753332bd72fef413e6b0b2ef1b4aadda7aa2c141f233712a6876b351''',
]
